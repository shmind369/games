<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>School Walk 3D(学校ウォークスルー)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    :root { --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #9cc8ea; color: #fff;
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #area { position: fixed; left: 12px; top: calc(var(--safe-t) + 10px); z-index: 5; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.45); font-size: 15px; font-weight: 700; letter-spacing: .05em; pointer-events: none; }
    #map { position: fixed; right: 10px; top: calc(var(--safe-t) + 10px); z-index: 5; width: 130px; border-radius: 10px; border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.35); touch-action: none; }
    #map.big { width: min(92vw, 420px); }
    #stickBase { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; z-index: 4; pointer-events: none;
      border: 2px solid rgba(255,255,255,.45); background: radial-gradient(circle, rgba(255,255,255,.18), rgba(255,255,255,.04)); opacity: .45; transition: opacity .15s; }
    #stickBase.on { opacity: 1; }
    #nub { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
    #help { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 8px); transform: translateX(-50%); z-index: 5; font-size: 11px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.4); white-space: nowrap; pointer-events: none; transition: opacity 1.2s; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="area">昇降口前</div>
  <canvas id="map"></canvas>
  <div id="stickBase"><div id="nub"></div></div>
  <div id="help">左下ドラッグ: 移動 ／ それ以外のドラッグ: 見回す ／ 地図タップ: 拡大</div>
  <script type="module" src="main.js"></script>
</body>
</html>
