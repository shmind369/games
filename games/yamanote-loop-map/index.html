<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>山手線ループマップ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #17301f;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    }
    #hud .label {
      font-size: clamp(11px, 3.2vw, 13px);
      opacity: 0.75;
    }
    #hud .station {
      font-size: clamp(18px, 5.5vw, 24px);
      font-weight: bold;
      color: #ffe066;
    }

    #hint {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(11px, 3.2vw, 13px);
      opacity: 0.65;
      pointer-events: none;
      z-index: 20;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #17301f;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="label">現在地</div>
    <div class="station" id="nearestStation">巣鴨駅付近</div>
  </div>
  <div id="hint">ドラッグでキャラクターを移動</div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="module" src="main.js"></script>
</body>
</html>
