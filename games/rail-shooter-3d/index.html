<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Rail Shooter 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #05070a;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: clamp(13px, 3.8vw, 18px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
      pointer-events: none;
      z-index: 30;
    }
    #hud .label { font-weight: bold; }
    #hp { color: #ff6b6b; }
    #score { color: #ffe066; }

    #progressWrap {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(60vw, 260px);
      height: 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.18);
      overflow: hidden;
      z-index: 30;
      pointer-events: none;
    }
    #progressBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4c8dff, #7cf0c0);
    }

    #hint {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(11px, 3.2vw, 13px);
      opacity: 0.65;
      pointer-events: none;
      z-index: 30;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      text-align: center;
      padding: 0 24px;
    }
    #overlay.show { display: flex; }
    #overlay h1 { margin: 0; font-size: clamp(26px, 8vw, 38px); }
    #overlay p { margin: 0; opacity: 0.85; }
    #overlay button {
      font-size: clamp(15px, 4.3vw, 17px);
      padding: 10px 28px;
      border-radius: 8px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #05070a;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><span class="label">HP</span> <span id="hp">5</span></div>
    <div><span class="label">SCORE</span> <span id="score">0</span></div>
  </div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="hint">ドラッグで左右移動・タップで射撃</div>

  <div id="overlay">
    <h1 id="overlayTitle">GAME OVER</h1>
    <p id="overlaySubtitle"></p>
    <button id="restartBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
