<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>Shoulder Cam TPS（肩越しカメラ プロトタイプ）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    :root { --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #07090c; color: #e8eef4;
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    /* 左下: 移動スティック */
    #stick { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: calc(var(--safe-b) + 26px); width: 138px; height: 138px; border-radius: 50%; z-index: 5; touch-action: none;
      border: 2px solid rgba(255,255,255,.32); background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.03)); }
    #stick::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1px dashed rgba(255,214,120,.28); }
    #nub { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(190,200,215,.55)); box-shadow: 0 3px 10px rgba(0,0,0,.5); }
    #stick.run { border-color: #ffd278; box-shadow: 0 0 16px rgba(255,200,100,.55); }
    /* 右下: アクションボタン(照準・攻撃・回避) */
    #btns { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(var(--safe-b) + 22px); z-index: 5; display: flex; flex-direction: column; gap: 14px; align-items: center; }
    #btns button { width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(20,24,32,.55); color: #fff; font: 700 12px system-ui, sans-serif; letter-spacing: .04em;
      touch-action: none; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; }
    #btns button svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; }
    #btns button.on { background: rgba(255,214,120,.9); color: #222; border-color: #fff; } #btns button.on svg { stroke: #222; }
    /* 照準(中央) */
    #cross { position: fixed; left: 50%; top: 46%; width: 34px; height: 34px; margin: -17px 0 0 -17px; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .15s; }
    #cross::before, #cross::after { content: ""; position: absolute; background: rgba(255,255,255,.85); }
    #cross::before { left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; -webkit-mask: linear-gradient(#000 0 30%, transparent 30% 70%, #000 70%); mask: linear-gradient(#000 0 30%, transparent 30% 70%, #000 70%); }
    #cross::after { top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; -webkit-mask: linear-gradient(90deg, #000 0 30%, transparent 30% 70%, #000 70%); mask: linear-gradient(90deg, #000 0 30%, transparent 30% 70%, #000 70%); }
    #flash { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: #fff; opacity: 0; }
    /* 上部: 状態表示と調整 */
    #hud { position: fixed; left: 10px; top: calc(var(--safe-t) + 8px); z-index: 6; font: 11px/1.5 ui-monospace, Menlo, monospace; color: #bfe3ff; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #gear { position: fixed; right: 10px; top: calc(var(--safe-t) + 8px); z-index: 7; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); color: #fff; font-size: 20px; padding: 0; touch-action: none; }
    #tune { position: fixed; right: 8px; top: calc(var(--safe-t) + 56px); width: min(290px, 78vw); max-height: 56vh; overflow-y: auto; z-index: 7; display: none; padding: 10px 12px; border-radius: 12px; background: rgba(8,12,18,.88); border: 1px solid rgba(255,255,255,.18); font-size: 12px; touch-action: pan-y; }
    #tune.show { display: block; }
    #tune h3 { margin: 0 0 6px; font-size: 13px; color: #ffd278; }
    #tune label { display: block; margin: 7px 0 0; color: #cfd8e3; }
    #tune label b { float: right; color: #fff; font-weight: 600; }
    #tune input[type=range] { width: 100%; margin: 2px 0 0; touch-action: pan-y; }
    #tune button { margin-top: 10px; padding: 7px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; font-size: 12px; touch-action: manipulation; }
    #msg { position: fixed; left: 50%; top: calc(var(--safe-t) + 52px); transform: translateX(-50%); z-index: 6; padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,.5); font-size: 12px; text-align: center; max-width: 96vw; white-space: nowrap; pointer-events: none; transition: opacity 1s; }
    #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #07090c; font-size: 14px; letter-spacing: .08em; text-align: center; padding: 24px; }
    #loading.err { color: #ff8b8b; } #loading pre { white-space: pre-wrap; text-align: left; max-width: 88vw; font-size: 12px; color: #ffc9c9; letter-spacing: 0; }
    #loading button { padding: 10px 22px; border-radius: 10px; border: 1px solid #fff5; background: #fff2; color: #fff; font-size: 14px; touch-action: manipulation; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="cross"></div><div id="flash"></div>
  <div id="hud"></div>
  <div id="msg">左:移動 ／ 右スワイプ:カメラ ／ 右下:照準・攻撃・回避</div>
  <button id="gear" aria-label="調整">⚙</button>
  <div id="tune"></div>
  <div id="stick"><div id="nub"></div></div>
  <div id="btns">
    <button id="bAim" aria-label="照準"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/></svg>照準</button>
    <button id="bAtk" aria-label="攻撃"><svg viewBox="0 0 24 24"><path d="M3 9h12l2-2h4v5h-4l-1 3h-3l-1 3H8l1-3H3z"/></svg>攻撃</button>
    <button id="bDodge" aria-label="回避"><svg viewBox="0 0 24 24"><circle cx="15" cy="5" r="2"/><path d="M13 9l-3 4 3 2v5M10 13l-4 1M13 9l4 3 3-1M13 15l4 3"/></svg>回避</button>
  </div>
  <div id="loading">LOADING...<small id="loadNote">中華娘モデルを読み込んでいます</small></div>
  <script type="module" src="main.js"></script>
</body>
</html>
