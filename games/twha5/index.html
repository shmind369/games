<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style type="text/css"> @import "style.css"; </style>
<script type="application/x-javascript">

'use strict';

const MAX_YEAR = 2019;

const data = {
	map_x: 2500,
	map_y: 580,
	year: -4000,
	zoom: 1,
	lang: 'ja',
	// 「国際関係」モード。ONの間だけ、国名タップの挙動がWikipedia要約
	// から関係性パネル表示に切り替わる(js/RelationsToggle.js・
	// js/RelationsPanel.js参照)
	relations_mode: false,
};

</script>
<script type="application/javascript" src="js/era.js" defer></script>
<script type="application/javascript" src="js/territory.js" defer></script>
<script type="application/javascript" src="js/regions.js" defer></script>
<script type="application/javascript" src="js/wars.js" defer></script>
<script type="application/javascript" src="js/relations.js" defer></script>
<script type="application/javascript" src="js/YearEvents.js" defer></script>
<script type="application/javascript" src="js/LangButton.js" defer></script>
<script type="application/javascript" src="js/CountryList.js" defer></script>
<script type="application/javascript" src="js/WikiPanel.js" defer></script>
<script type="application/javascript" src="js/RelationsPanel.js" defer></script>
<script type="application/javascript" src="js/RelationsToggle.js" defer></script>
<script type="application/javascript" src="js/YearControls.js" defer></script>
<script type="application/javascript" src="js/ZoomBar.js" defer></script>
<script type="application/javascript" src="js/YearText.js" defer></script>
<script type="application/javascript" src="js/YearBar.js" defer></script>
<script type="application/javascript" src="js/Region.js" defer></script>
<script type="application/javascript" src="js/WarMarker.js" defer></script>
<script type="application/javascript" src="js/Map.js" defer></script>
<script type="application/javascript" src="js/twha.js" defer></script>
<title>The World Historical Atras</title>
</head>
<body>
<div id="head">
<div id="scale-zoom"><img src="img/thumb-v.png" id="scale-zoom-cursor" alt=""></div>
<div class="lang-button" id="lang-ja"></div><div class="lang-button" id="lang-en"></div><div class="lang-button" id="lang-zh"></div>
<form id="year"><span id="year-text"></span><input type="text" id="year-input" value="" autocomplete="no"></form>
<div id="year-sub"></div>
</div>
<div id="layer-land"></div>
<div id="layer-tert"></div>
<div id="layer-info"></div>
<div id="year-bar">
<canvas id="year-bar-scale"></canvas><div id="year-bar-cursor"></div>
</div>
<div id="country-list-toggle">国</div>
<div id="relations-toggle">🌐</div>
<div id="country-list-panel">
<div id="country-list-headbar">
<div id="country-list-grabber"></div>
<span id="country-list-title"></span>
</div>
<div id="country-list-body"></div>
</div>
<div id="wiki-panel">
<div id="wiki-panel-headbar">
<div id="wiki-panel-grabber"></div>
<span id="wiki-panel-title"></span>
</div>
<div id="wiki-panel-body"></div>
</div>
<div id="relations-panel">
<div id="relations-panel-headbar">
<div id="relations-panel-grabber"></div>
<span id="relations-panel-title"></span>
</div>
<div id="relations-panel-body"></div>
</div>
<div id="year-controls">
<button id="year-controls-prev" type="button">&#9664;</button>
<span id="year-controls-year"></span><input type="text" id="year-controls-year-input" autocomplete="off">
<button id="year-controls-next" type="button">&#9654;</button>
</div>
</body>
</html>
