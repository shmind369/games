<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Pinball 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #05050a;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: clamp(14px, 4vw, 20px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 30;
    }
    #hud span { font-weight: bold; }

    #hint {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(10px, 3vw, 13px);
      opacity: 0.6;
      pointer-events: none;
      z-index: 30;
      text-align: center;
    }

    /* Touch zones for flippers: bottom ~78% of the screen, split left/right. */
    #flipperLeftZone, #flipperRightZone {
      position: fixed;
      bottom: 0;
      top: 22vh;
      width: 50%;
      touch-action: none;
      z-index: 10;
    }
    #flipperLeftZone { left: 0; }
    #flipperRightZone { right: 0; }

    #launchBtn {
      position: fixed;
      top: max(64px, calc(env(safe-area-inset-top) + 56px));
      right: 14px;
      width: clamp(64px, 18vw, 84px);
      height: clamp(64px, 18vw, 84px);
      border-radius: 50%;
      background: rgba(255, 90, 90, 0.18);
      border: 2px solid rgba(255, 120, 120, 0.55);
      color: #ffb3b3;
      font-size: clamp(12px, 3.4vw, 14px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      touch-action: none;
      z-index: 30;
    }
    #launchBtn.charging { background: rgba(255, 90, 90, 0.45); }

    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
      padding: 0 24px;
      z-index: 50;
    }
    #overlay.show { display: flex; }
    #overlay h1 { margin: 0; font-size: clamp(28px, 8vw, 42px); }
    #overlay button {
      font-size: clamp(16px, 4.5vw, 18px);
      padding: 12px 32px;
      border-radius: 8px;
      border: none;
      background: #4c8dff;
      color: white;
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #05050a;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BALL: <span id="ballsLeft">3</span></div>
  </div>
  <div id="hint">左右タップでフリッパー</div>

  <div id="flipperLeftZone"></div>
  <div id="flipperRightZone"></div>
  <div id="launchBtn">押して<br />発射</div>

  <div id="overlay">
    <h1 id="overlayTitle">Game Over</h1>
    <button id="restartBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
