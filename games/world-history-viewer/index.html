<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>世界史閲覧</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1117;
    --bg-soft: #171a24;
    --panel: #f6f0df;
    --panel-text: #241d12;
    --panel-text-soft: #6b6046;
    --line: rgba(36, 29, 18, 0.16);
    --text: #eef0f6;
    --text-soft: #9a9fb5;
    --gold: #c9962f;
    --gold-bright: #e9b94a;
    --shadow: rgba(0, 0, 0, 0.55);
    --japan: #b5432f;
    --china: #a86a1f;
    --europe: #2f5fa8;
    --middleeast: #2f8f6b;
    --other: #6a6f87;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
  }
  body {
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201, 150, 47, 0.14), transparent 60%),
      var(--bg);
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  a { color: inherit; }
  button { font: inherit; cursor: pointer; }

  header.top {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(15, 17, 23, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding: 14px 18px 18px;
  }
  .brand {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--gold-bright);
    text-align: center;
    margin: 0 0 10px;
  }

  .year-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 3vw, 20px);
    max-width: 720px;
    margin: 0 auto;
  }
  .nav-btn {
    background: var(--bg-soft);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-soft);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover { background: #232838; color: var(--text); }
  .nav-btn:active { background: #2b3145; }
  .nav-btn.big { font-size: 20px; padding: 6px 16px; color: var(--text); }

  .year-core { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  form#yearForm { display: flex; align-items: baseline; gap: 4px; }
  #yearInput {
    width: 5.2ch;
    background: transparent;
    border: none;
    outline: none;
    color: var(--gold-bright);
    font-family: "Shippori Mincho", serif;
    font-weight: 800;
    font-size: clamp(38px, 9vw, 58px);
    text-align: right;
    caret-color: var(--gold-bright);
  }
  .year-suffix {
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: clamp(20px, 4vw, 26px);
    color: var(--text-soft);
  }
  .period-label {
    font-size: 12.5px;
    color: var(--text-soft);
    letter-spacing: 0.04em;
  }
  .period-label b { color: var(--gold-bright); font-weight: 700; }

  .jump-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .jump-row .nav-btn { font-size: 12px; padding: 6px 12px; }

  .era-strip {
    max-width: 900px;
    margin: 12px auto 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px;
  }
  .era-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-soft);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-soft);
    border-left: 3px solid var(--other);
  }
  .era-chip .flag { font-size: 13px; }
  .era-chip b { color: var(--text); font-weight: 700; }
  .era-chip[data-region="japan"] { border-color: var(--japan); }
  .era-chip[data-region="china"] { border-color: var(--china); }
  .era-chip[data-region="europe"] { border-color: var(--europe); }
  .era-chip[data-region="middleeast"] { border-color: var(--middleeast); }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }

  h2.section-title {
    font-family: "Shippori Mincho", serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin: 34px 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2.section-title:first-child { margin-top: 0; }
  h2.section-title .count { font-size: 12px; color: var(--text-soft); font-weight: 400; }

  #regionGrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }

  .region-card {
    background: var(--panel);
    color: var(--panel-text);
    border-radius: 14px;
    padding: 18px 18px 16px;
    box-shadow: 0 18px 40px -22px var(--shadow);
    border-top: 5px solid var(--other);
  }
  .region-card[data-region="japan"] { border-color: var(--japan); }
  .region-card[data-region="china"] { border-color: var(--china); }
  .region-card[data-region="europe"] { border-color: var(--europe); }
  .region-card[data-region="middleeast"] { border-color: var(--middleeast); }

  .region-card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .region-card-head .name { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 17px; }
  .region-card-head .flag { font-size: 20px; margin-right: 6px; }
  .region-card .era { font-size: 12.5px; color: var(--panel-text-soft); margin: 0 0 12px; }

  .person-mini {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(36, 29, 18, 0.05);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    transition: background 0.12s, transform 0.12s;
  }
  .person-mini:hover { background: rgba(36, 29, 18, 0.1); transform: translateY(-1px); }
  .person-mini:last-child { margin-bottom: 0; }
  .person-mini-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .person-mini .pname { font-weight: 700; font-size: 15px; }
  .person-mini .page { font-weight: 700; color: var(--japan); font-size: 14px; white-space: nowrap; }
  .person-mini .poccupation { font-size: 11.5px; color: var(--panel-text-soft); margin-top: 1px; }
  .person-mini .pnote { font-size: 12.5px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .region-card .empty { font-size: 12.5px; color: var(--panel-text-soft); padding: 6px 0; }

  /* alive-in-year section */
  .alive-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .seg {
    display: inline-flex;
    background: var(--bg-soft);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .seg button {
    background: transparent;
    border: none;
    color: var(--text-soft);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px;
  }
  .seg button.active { background: var(--gold); color: #1a1305; font-weight: 700; }
  .filter-chip {
    background: var(--bg-soft);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-soft);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
  }
  .filter-chip.active { background: var(--gold); color: #1a1305; border-color: var(--gold); font-weight: 700; }

  #aliveList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 10px;
  }
  .alive-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 10px 14px;
    border-left: 4px solid var(--other);
  }
  .alive-item[data-region="japan"] { border-color: var(--japan); }
  .alive-item[data-region="china"] { border-color: var(--china); }
  .alive-item[data-region="europe"] { border-color: var(--europe); }
  .alive-item[data-region="middleeast"] { border-color: var(--middleeast); }
  .alive-item .name { font-size: 13.5px; font-weight: 600; }
  .alive-item .region-tag { font-size: 10.5px; color: var(--text-soft); }
  .alive-item .age { font-weight: 700; color: var(--gold-bright); font-size: 14px; white-space: nowrap; }

  /* events section */
  #eventGroups { display: flex; flex-direction: column; gap: 22px; }
  .event-group h3 {
    font-size: 14px;
    color: var(--text-soft);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .event-card {
    background: var(--bg-soft);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border-left: 4px solid var(--other);
  }
  .event-card[data-region="japan"] { border-color: var(--japan); }
  .event-card[data-region="china"] { border-color: var(--china); }
  .event-card[data-region="europe"] { border-color: var(--europe); }
  .event-card[data-region="middleeast"] { border-color: var(--middleeast); }
  .event-card .ehead { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .event-card .title { font-weight: 700; font-size: 14.5px; }
  .event-card .date { font-size: 11.5px; color: var(--text-soft); white-space: nowrap; }
  .event-card .meta { font-size: 11.5px; color: var(--text-soft); margin-top: 3px; }
  .event-card .desc {
    font-size: 12.5px;
    color: var(--text-soft);
    margin-top: 6px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .event-card.expanded .desc { -webkit-line-clamp: unset; }
  .event-card .toggle {
    background: none;
    border: none;
    color: var(--gold);
    font-size: 11.5px;
    padding: 4px 0 0;
  }
  #emptyState {
    text-align: center;
    color: var(--text-soft);
    font-size: 13px;
    padding: 30px 10px;
    display: none;
  }

  /* person detail overlay */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    background: rgba(6, 7, 10, 0.72);
    backdrop-filter: blur(4px);
    padding: 24px 14px;
    overflow-y: auto;
  }
  #overlay.show { display: flex; justify-content: center; }
  .detail-panel {
    background: var(--panel);
    color: var(--panel-text);
    border-radius: 16px;
    max-width: 620px;
    width: 100%;
    height: fit-content;
    padding: 26px 24px 30px;
    position: relative;
  }
  .detail-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(36, 29, 18, 0.08);
    border: none;
    color: var(--panel-text);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
  }
  .detail-head .name { font-family: "Shippori Mincho", serif; font-size: 26px; font-weight: 700; margin: 0; }
  .detail-head .years { color: var(--panel-text-soft); font-size: 13px; margin: 2px 0 8px; }
  .detail-head .occupation {
    display: inline-block;
    background: rgba(36, 29, 18, 0.08);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .detail-head .desc { font-size: 13.5px; line-height: 1.7; color: var(--panel-text); margin: 0 0 20px; }

  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 68px;
    top: 6px;
    bottom: 6px;
    width: 2px;
    background: var(--line);
  }
  .timeline li {
    position: relative;
    display: grid;
    grid-template-columns: 60px 20px 1fr;
    gap: 4px;
    padding: 10px 0;
    align-items: start;
  }
  .timeline .tyear { font-weight: 700; text-align: right; font-size: 13px; }
  .timeline .tdot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--panel-text-soft);
    margin: 4px auto 0;
    z-index: 1;
  }
  .timeline .tbody .tage { font-size: 11px; color: var(--panel-text-soft); }
  .timeline .tbody .ttitle { font-size: 13.5px; font-weight: 600; }
  .timeline li.current .tdot { background: var(--gold); box-shadow: 0 0 0 4px rgba(201, 150, 47, 0.25); }
  .timeline li.current .tyear,
  .timeline li.current .ttitle { color: var(--japan); }
  .timeline li.current { background: rgba(181, 67, 47, 0.06); border-radius: 8px; }

  footer.credit {
    text-align: center;
    color: var(--text-soft);
    font-size: 11.5px;
    padding: 20px;
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    .timeline::before { left: 58px; }
    .timeline li { grid-template-columns: 50px 16px 1fr; }
  }
</style>
</head>
<body>
  <header class="top">
    <p class="brand">🌍 世界史閲覧</p>
    <div class="year-row">
      <button class="nav-btn big" id="prevYearBtn" title="前の年">←</button>
      <div class="year-core">
        <form id="yearForm">
          <input id="yearInput" class="mono" inputmode="numeric" autocomplete="off" />
          <span class="year-suffix">年</span>
        </form>
        <p class="period-label" id="periodLabel"></p>
      </div>
      <button class="nav-btn big" id="nextYearBtn" title="次の年">→</button>
    </div>
    <div class="jump-row">
      <button class="nav-btn" id="jumpBack10">← 10年前</button>
      <button class="nav-btn" id="jumpBack1">← 前の年</button>
      <button class="nav-btn" id="shareBtn">🔗 この年を共有</button>
      <button class="nav-btn" id="jumpFwd1">次の年 →</button>
      <button class="nav-btn" id="jumpFwd10">10年後 →</button>
    </div>
    <div class="era-strip" id="eraStrip"></div>
  </header>

  <main>
    <h2 class="section-title">地域別の状況</h2>
    <div id="regionGrid"></div>

    <h2 class="section-title">この年に生きていた人物 <span class="count" id="aliveCount"></span></h2>
    <div class="alive-controls">
      <div class="seg" id="sortSeg">
        <button data-sort="age-asc" class="active">年齢順</button>
        <button data-sort="age-desc">年齢順(逆)</button>
        <button data-sort="region">地域順</button>
      </div>
      <div id="ageFilters"></div>
    </div>
    <div id="aliveList"></div>

    <h2 class="section-title" id="eventsTitle"></h2>
    <div id="eventGroups"></div>

    <p id="emptyState">この年についてのくわしい記録はまだありません。年代を移動して探索してみてください。</p>
  </main>

  <footer class="credit">西暦を入力すると、その年の世界がひらきます。</footer>

  <div id="overlay">
    <div class="detail-panel" id="detailPanel"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
