<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Maze Runner 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0a12;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 18px;
      font-size: 18px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
      user-select: none;
    }
    #hud span { font-weight: bold; }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 12px;
      font-size: 13px;
      opacity: 0.7;
      pointer-events: none;
      user-select: none;
    }
    #touchHint {
      position: fixed;
      bottom: 156px;
      left: 12px;
      font-size: 13px;
      opacity: 0.7;
      pointer-events: none;
      user-select: none;
      display: none;
    }

    #joystickBase {
      position: fixed;
      left: 28px;
      bottom: 28px;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      touch-action: none;
      display: none;
      z-index: 20;
    }
    #joystickKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      margin-left: -24px;
      margin-top: -24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    @media (pointer: coarse), (hover: none) {
      #hint { display: none; }
      #touchHint { display: block; }
      #joystickBase { display: block; }
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
    }
    #overlay.show { display: flex; }
    #overlay h1 { margin: 0; font-size: 42px; }
    #overlay button {
      font-size: 18px;
      padding: 10px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #4c8dff;
      color: white;
    }
    #overlay button:hover { background: #3a75e0; }
  </style>
</head>
<body>
  <div id="hud">
    <div>Coins: <span id="coinCount">0</span>/<span id="coinTotal">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>
  <div id="hint">WASD / 矢印キーで移動</div>
  <div id="touchHint">左下のスティックで移動</div>

  <div id="joystickBase">
    <div id="joystickKnob"></div>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">Game Over</h1>
    <button id="restartBtn">もう一度</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
