<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Maze Runner 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0a0a12;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      display: flex;
      gap: 4vw;
      font-size: clamp(14px, 4vw, 20px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #hud span { font-weight: bold; }

    #touchHint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 22vh);
      left: 16px;
      font-size: clamp(11px, 3.2vw, 14px);
      opacity: 0.7;
      pointer-events: none;
    }

    #joystickBase {
      position: fixed;
      left: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      width: clamp(92px, 26vw, 128px);
      height: clamp(92px, 26vw, 128px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      touch-action: none;
      z-index: 20;
    }
    #joystickKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      margin-left: -21%;
      margin-top: -21%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
      padding: 0 24px;
    }
    #overlay.show { display: flex; }
    #overlay h1 { margin: 0; font-size: clamp(28px, 8vw, 42px); }
    #overlay button {
      font-size: clamp(16px, 4.5vw, 18px);
      padding: 12px 32px;
      border-radius: 8px;
      border: none;
      background: #4c8dff;
      color: white;
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #0a0a12;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>Coins: <span id="coinCount">0</span>/<span id="coinTotal">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>
  <div id="touchHint">左下のスティックで移動</div>

  <div id="joystickBase">
    <div id="joystickKnob"></div>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">Game Over</h1>
    <button id="restartBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
