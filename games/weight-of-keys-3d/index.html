<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Weight of Keys</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #07080b;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas#game { display: block; touch-action: none; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #hud .pill {
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #keyCount { font-variant-numeric: tabular-nums; font-weight: 700; }
    #keyCount.ready { color: #ffd23f; }

    #weightWrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    #weightBar {
      width: 108px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      overflow: hidden;
    }
    #weightFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5cc8ff, #ffb14c);
      transition: width 0.25s;
    }
    #weightLabel { font-size: 10.5px; opacity: 0.8; letter-spacing: 0.03em; }

    #message {
      position: fixed;
      top: 26%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(0,0,0,0.65);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 80%;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    #message.show { opacity: 1; }

    /* ---------- Look layer (drag anywhere to look around) ---------- */
    #lookLayer {
      position: fixed;
      inset: 0;
      z-index: 5;
    }

    /* ---------- Movement joystick ---------- */
    #joystickBase {
      position: fixed;
      left: max(20px, env(safe-area-inset-left));
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 20;
      width: clamp(96px, 26vw, 128px);
      height: clamp(96px, 26vw, 128px);
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.22);
      touch-action: none;
    }
    #joystickKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46%;
      height: 46%;
      margin-left: -23%;
      margin-top: -23%;
      border-radius: 50%;
      background: rgba(255,255,255,0.32);
      border: 1px solid rgba(255,255,255,0.5);
      pointer-events: none;
    }

    /* ---------- Action buttons ---------- */
    #actions {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    .actionBtn {
      min-width: 92px;
      padding: 13px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(20,20,26,0.7);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      touch-action: manipulation;
      opacity: 0;
      transform: translateY(6px) scale(0.95);
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none;
    }
    .actionBtn.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    #pickupBtn { background: rgba(255,210,63,0.22); border-color: rgba(255,210,63,0.6); }
    #pickupBtn:active { background: rgba(255,210,63,0.4); }
    #dropBtn { background: rgba(92,200,255,0.18); border-color: rgba(92,200,255,0.55); }
    #dropBtn:active { background: rgba(92,200,255,0.35); }

    #dropTray {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: 128px;
      z-index: 21;
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    #dropTray.show { display: flex; }
    .dropChip {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(10,10,14,0.88);
      border: 1px solid rgba(255,255,255,0.28);
      color: #fff;
      font-size: 12.5px;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .dropChip:active { background: rgba(255,255,255,0.15); }

    /* ---------- Overlays ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 32px;
      background: rgba(5,5,8,0.95);
    }
    .overlay.show { display: flex; }
    .overlay h1 { margin: 0; font-size: 24px; letter-spacing: 0.02em; }
    .overlay p { margin: 0; font-size: 13px; line-height: 1.7; opacity: 0.85; max-width: 340px; }
    .bigBtn {
      padding: 14px 32px;
      border-radius: 999px;
      border: none;
      background: #4c8dff;
      color: #fff;
      font-size: 16px;
      touch-action: manipulation;
    }
    .bigBtn:active { background: #3a72db; }

    #startOverlay h1 { color: #ffd23f; }
    #startOverlay ul { text-align: left; font-size: 12.5px; line-height: 1.8; opacity: 0.85; max-width: 320px; margin: 0; padding-left: 1.2em; }
    #caughtOverlay h1 { color: #ff5c6c; }
    #clearOverlay h1 { color: #6affa0; }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #07080b;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="lookLayer"></div>

  <div id="hud">
    <div class="pill">🔑 <span id="keyCount">0 / 0</span></div>
    <div id="weightWrap">
      <div class="pill" style="padding:6px 12px;">
        <div id="weightBar"><div id="weightFill"></div></div>
      </div>
      <span id="weightLabel">重さ 0</span>
    </div>
  </div>

  <div id="message"></div>

  <div id="joystickBase"><div id="joystickKnob"></div></div>

  <div id="actions">
    <button id="pickupBtn" class="actionBtn">拾う</button>
    <button id="dropBtn" class="actionBtn">置く</button>
  </div>
  <div id="dropTray"></div>

  <div class="overlay show" id="startOverlay">
    <h1>WEIGHT OF KEYS</h1>
    <p>迷宮に隠された鍵を集め、必要な数がそろったら出口から脱出せよ。</p>
    <ul>
      <li>鍵を持つほど<b>重く、遅く</b>なる — 持ちすぎれば追跡者に追いつかれる</li>
      <li>危険を感じたら、その場に<b>置いて</b>身軽になれ(あとで拾い直せる)</li>
      <li>追跡者の<b>足音</b>に耳を澄ませ、近さを判断せよ</li>
    </ul>
    <button class="bigBtn" id="startBtn">迷宮へ入る</button>
  </div>

  <div class="overlay" id="caughtOverlay">
    <h1>捕まった…</h1>
    <p id="caughtDetail"></p>
    <button class="bigBtn" id="retryBtn">もう一度</button>
  </div>

  <div class="overlay" id="clearOverlay">
    <h1>脱出成功!</h1>
    <p id="clearDetail"></p>
    <button class="bigBtn" id="againBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">画面を縦向きにしてください</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
