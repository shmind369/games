<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Card Canvas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #f3efe8;
      font-family: system-ui, sans-serif;
      color: #3a352e;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }

    #board {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #f8f4ee 0%, #efe9df 100%);
    }

    .card {
      position: absolute;
      width: 152px;
      height: 108px;
      border-radius: 14px;
      padding: 12px 14px;
      box-sizing: border-box;
      box-shadow: 0 2px 6px rgba(60, 50, 30, 0.14), 0 1px 2px rgba(60, 50, 30, 0.08);
      touch-action: none;
      cursor: grab;
      transform: scale(1);
      transition: transform 0.32s cubic-bezier(0.22, 1.1, 0.4, 1), box-shadow 0.22s ease-out, opacity 0.22s ease-out;
      will-change: transform;
    }
    .card.dragging {
      cursor: grabbing;
      box-shadow: 0 10px 20px rgba(60, 50, 30, 0.22), 0 3px 8px rgba(60, 50, 30, 0.14);
      transform: scale(1.045);
      transition: box-shadow 0.16s ease-out, transform 0.16s ease-out;
    }
    .card.entering {
      opacity: 0;
      transform: scale(0.82);
    }
    .card.leaving {
      opacity: 0;
      transform: scale(0.84);
      transition: transform 0.2s ease-in, opacity 0.2s ease-in;
    }
    .cardTitle {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cardBody {
      font-size: 12px;
      line-height: 1.45;
      opacity: 0.72;
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cardTitle.empty, .cardBody.empty { opacity: 0.35; font-style: italic; font-weight: 400; }

    #emptyHint {
      position: fixed;
      top: 40%;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #emptyHint.hide { opacity: 0; }

    #addBtn {
      position: fixed;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 56px;
      height: 56px;
      border-radius: 999px;
      border: none;
      background: #ffffff;
      color: #3a352e;
      font-size: 26px;
      line-height: 56px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(60, 50, 30, 0.2);
      touch-action: manipulation;
      transition: transform 0.15s ease-out;
      z-index: 9000;
    }
    #addBtn.pressed { transform: scale(0.92); }

    #sheetBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 34, 24, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease-out;
      z-index: 9500;
    }
    #sheetBackdrop.show { opacity: 1; pointer-events: auto; }

    #editSheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fbf8f3;
      border-radius: 20px 20px 0 0;
      padding: 18px 20px max(18px, env(safe-area-inset-bottom));
      box-shadow: 0 -6px 24px rgba(40, 34, 24, 0.18);
      transform: translateY(105%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 9600;
      touch-action: auto;
    }
    #editSheet.show { transform: translateY(0); }

    #editSheet input, #editSheet textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: none;
      border-radius: 10px;
      background: #f1ece2;
      padding: 10px 12px;
      font: inherit;
      color: #3a352e;
      touch-action: manipulation;
      -webkit-user-select: text;
      user-select: text;
      margin-bottom: 10px;
    }
    #editTitle { font-size: 16px; font-weight: 600; }
    #editBody { font-size: 14px; resize: none; height: 90px; line-height: 1.5; }

    #colorRow { display: flex; gap: 10px; margin-bottom: 16px; }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 2px solid transparent;
      touch-action: manipulation;
    }
    .swatch.selected { border-color: #3a352e; }

    #sheetActions { display: flex; justify-content: space-between; gap: 12px; }
    .sheetBtn {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      touch-action: manipulation;
    }
    #closeBtn { background: #3a352e; color: #fbf8f3; }
    #deleteBtn { background: transparent; color: #a8785f; }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #f3efe8;
      color: #3a352e;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="board"></div>
  <div id="emptyHint">＋ から最初のカードを置いてみてください</div>

  <button id="addBtn">＋</button>

  <div id="sheetBackdrop"></div>
  <div id="editSheet">
    <input id="editTitle" type="text" placeholder="タイトル" maxlength="60" />
    <textarea id="editBody" placeholder="本文"></textarea>
    <div id="colorRow"></div>
    <div id="sheetActions">
      <button id="deleteBtn" class="sheetBtn">削除</button>
      <button id="closeBtn" class="sheetBtn">閉じる</button>
    </div>
  </div>

  <div id="rotateOverlay">縦向きにしてお使いください</div>

  <script type="module" src="main.js"></script>
</body>
</html>
