<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>HIP DROP! ver.0.1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    html, body {
      margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none;
      background: #8fd3ff; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: #fff;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }
    canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #touch { position: fixed; inset: 0; touch-action: none; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
      padding: calc(10px + env(safe-area-inset-top)) 14px 0;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    }
    #hp { font-size: 26px; letter-spacing: 2px; color: #ff4d6d; }
    #hp .empty { color: rgba(255,255,255,0.45); }
    #timer { font-size: 20px; font-variant-numeric: tabular-nums; }
    #enemyCount { font-size: 18px; }

    #toast {
      position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top)); transform: translate(-50%, -8px);
      background: rgba(30,30,50,0.72); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 700;
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; max-width: 92vw;
      overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- 仮想スティック(左下) ---------- */
    #stick {
      position: fixed; width: 128px; height: 128px; margin: -64px 0 0 -64px; pointer-events: none;
      left: calc(96px + env(safe-area-inset-left));
      top: calc(100% - 120px - env(safe-area-inset-bottom));
      border-radius: 50%; background: rgba(255,255,255,0.18); border: 3px solid rgba(255,255,255,0.55);
      opacity: 0.55; transition: opacity .15s;
    }
    #stick.active { opacity: 1; transition: none; }
    #stickKnob {
      position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
      border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    #stickKnob span { display: none; }

    /* ---------- 動的ジャンプボタン(下中央の固定パッド + 移動方向側に出るボタン) ---------- */
    body[data-layout="dynamic"] #jumpBtn { display: none; }
    body[data-layout="dynamic"] #stick {
      width: 156px; height: 156px; margin: -78px 0 0 -78px;
      left: 50%; top: calc(100% - 118px - env(safe-area-inset-bottom));
      opacity: 0.8; background: rgba(255,255,255,0.16);
    }
    body[data-layout="dynamic"] #stickKnob { width: 62px; height: 62px; margin: -31px 0 0 -31px; }
    /* 位置は transform だけで動かす(レイアウトを動かさない)。表示/非表示は内側の .face で拡大縮小+フェード */
    #dynJump { position: fixed; left: 0; top: 0; width: 76px; height: 76px; pointer-events: none; display: none; will-change: transform; }
    body[data-layout="dynamic"] #dynJump { display: block; }
    #dynJump .face {
      width: 100%; height: 100%; border-radius: 50%; box-sizing: border-box;
      background: radial-gradient(circle at 40% 35%, #ff8fa3, #ff3b6b 72%);
      border: 4px solid rgba(255,255,255,0.9); box-shadow: 0 5px 0 #b0213f, 0 7px 14px rgba(0,0,0,0.25);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 15px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.25);
      opacity: 0; transform: scale(0.35);
      transition: opacity .12s ease-out, transform .14s cubic-bezier(.3,1.6,.6,1), box-shadow .05s;
    }
    #dynJump.show .face { opacity: 1; transform: scale(1); }
    #dynJump.show.frozen .face { box-shadow: 0 5px 0 #b0213f, 0 0 0 5px rgba(255,255,255,0.35); }
    #dynJump.on .face { transform: scale(0.9) translateY(3px); box-shadow: 0 2px 0 #b0213f; transition-duration: .04s; }

    /* ---------- ジェスチャー(指を置いた位置にスティック。待機中は非表示) ---------- */
    body[data-layout="gesture"] #jumpBtn { display: none; }
    body[data-layout="gesture"] #stick { opacity: 0; }
    body[data-layout="gesture"] #stick.active { opacity: 0.9; }
    #tapFx {
      position: fixed; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.9); opacity: 0; pointer-events: none;
    }
    #tapFx.go { animation: tapfx .3s ease-out; }
    @keyframes tapfx { from { opacity: 1; transform: scale(0.4); } to { opacity: 0; transform: scale(1.3); } }

    /* ---------- センターパッド(画面下中央に固定。真ん中タップ=ジャンプ) ---------- */
    body[data-layout="center"] #jumpBtn { display: none; }
    body[data-layout="center"] #stick {
      width: 156px; height: 156px; margin: -78px 0 0 -78px;
      left: 50%; top: calc(100% - 118px - env(safe-area-inset-bottom));
      opacity: 0.8; background: rgba(255,255,255,0.16);
    }
    body[data-layout="center"] #stick::before {
      /* ジャンプ判定の範囲(真ん中)の目印 */
      content: ''; position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px;
      border-radius: 50%; border: 2px dashed rgba(255,255,255,0.6);
    }
    body[data-layout="center"] #stickKnob {
      width: 64px; height: 64px; margin: -32px 0 0 -32px;
      background: radial-gradient(circle at 40% 35%, #ff8fa3, #ff3b6b 75%);
      border: 3px solid rgba(255,255,255,0.9);
      display: flex; align-items: center; justify-content: center;
    }
    body[data-layout="center"] #stickKnob span {
      display: block; font-weight: 900; font-size: 13px; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
    body[data-layout="center"] #stick.jump #stickKnob { box-shadow: 0 0 0 6px rgba(255,224,102,0.7); }
    #stick::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #ffe066; opacity: 0; pointer-events: none;
    }
    #stick.hip::after { animation: hipflash .35s ease-out; }

    .layoutSel { margin-top: 16px; font-size: 13px; }
    .layoutSel button {
      font: inherit; font-weight: 700; color: #fff; background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.5); border-radius: 999px; padding: 6px 12px; margin: 4px 2px; cursor: pointer;
    }
    .layoutSel button.sel { background: #fff; color: #ff3b6b; border-color: #fff; }

    /* ---------- ジャンプボタン(右下) ---------- */
    #jumpBtn {
      position: fixed; pointer-events: none;
      right: calc(26px + env(safe-area-inset-right)); bottom: calc(46px + env(safe-area-inset-bottom));
      width: 104px; height: 104px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #ff8fa3, #ff3b6b 70%);
      border: 4px solid rgba(255,255,255,0.85); box-shadow: 0 6px 0 #b0213f, 0 8px 16px rgba(0,0,0,0.25);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 900; font-size: 18px; text-shadow: 0 2px 0 rgba(0,0,0,0.25);
      transition: transform .05s, box-shadow .05s;
    }
    #jumpBtn small { font-size: 10px; font-weight: 700; opacity: 0.9; margin-top: 2px; }
    #jumpBtn.on { transform: translateY(4px); box-shadow: 0 2px 0 #b0213f, 0 4px 8px rgba(0,0,0,0.25); }
    #jumpBtn::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #ffe066; opacity: 0;
    }
    #jumpBtn.hip::after { animation: hipflash .35s ease-out; }
    @keyframes hipflash { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.5); } }

    /* ---------- タイトル/クリア ---------- */
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(20,30,60,0.55); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      text-align: center; padding: 20px; box-sizing: border-box; touch-action: manipulation;
    }
    #overlay.hidden { display: none; }
    #ovTitle { font-size: 44px; font-weight: 900; letter-spacing: 1px; margin: 0 0 14px; text-shadow: 0 4px 0 #ff3b6b; }
    #ovText { font-size: 16px; line-height: 1.6; margin-bottom: 22px; }
    .howto div { margin: 6px 0; }
    .howto .sub { font-size: 13px; opacity: 0.85; margin-top: 12px; }
    @media (pointer: coarse) { .howto .pc { display: none; } }
    #ovBtn {
      font-size: 22px; font-weight: 900; color: #fff; padding: 14px 44px; border-radius: 999px; border: 0;
      background: #ff3b6b; box-shadow: 0 6px 0 #b0213f; cursor: pointer;
    }
    #ovBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b0213f; }
  </style>
</head>
<body data-layout="dynamic">
  <canvas id="game"></canvas>
  <div id="touch">
    <div id="stick"><div id="stickKnob"><span>JUMP</span></div></div>
    <div id="tapFx"></div>
    <div id="dynJump"><div class="face">JUMP</div></div>
    <div id="jumpBtn">JUMP<small>↓スワイプでヒップ</small></div>
  </div>

  <div id="hud">
    <div id="hp"></div>
    <div id="timer">0.0</div>
    <div id="enemyCount"></div>
  </div>
  <div id="toast"></div>

  <div id="overlay" class="ui-block">
    <div id="ovTitle"></div>
    <div id="ovText"></div>
    <button id="ovBtn"></button>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
