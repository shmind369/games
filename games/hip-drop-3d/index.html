<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>HIP DROP! ver.0.1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    html, body {
      margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none;
      background: #8fd3ff; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: #fff;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }
    canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #touch { position: fixed; inset: 0; touch-action: none; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
      padding: calc(10px + env(safe-area-inset-top)) 14px 0;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    }
    #hp { font-size: 26px; letter-spacing: 2px; color: #ff4d6d; }
    #hp .empty { color: rgba(255,255,255,0.45); }
    #timer { font-size: 20px; font-variant-numeric: tabular-nums; }
    #enemyCount { font-size: 18px; }

    #toast {
      position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top)); transform: translate(-50%, -8px);
      background: rgba(30,30,50,0.72); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 700;
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; max-width: 92vw;
      overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- 仮想スティック(左下) ---------- */
    #stick {
      position: fixed; width: 128px; height: 128px; margin: -64px 0 0 -64px; pointer-events: none;
      left: calc(96px + env(safe-area-inset-left));
      top: calc(100% - 120px - env(safe-area-inset-bottom));
      border-radius: 50%; background: rgba(255,255,255,0.18); border: 3px solid rgba(255,255,255,0.55);
      opacity: 0.55; transition: opacity .15s;
    }
    #stick.active { opacity: 1; transition: none; }
    #stickKnob {
      position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px;
      border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    /* ---------- ジャンプボタン(右下) ---------- */
    #jumpBtn {
      position: fixed; pointer-events: none;
      right: calc(26px + env(safe-area-inset-right)); bottom: calc(46px + env(safe-area-inset-bottom));
      width: 104px; height: 104px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #ff8fa3, #ff3b6b 70%);
      border: 4px solid rgba(255,255,255,0.85); box-shadow: 0 6px 0 #b0213f, 0 8px 16px rgba(0,0,0,0.25);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 900; font-size: 18px; text-shadow: 0 2px 0 rgba(0,0,0,0.25);
      transition: transform .05s, box-shadow .05s;
    }
    #jumpBtn small { font-size: 10px; font-weight: 700; opacity: 0.9; margin-top: 2px; }
    #jumpBtn.on { transform: translateY(4px); box-shadow: 0 2px 0 #b0213f, 0 4px 8px rgba(0,0,0,0.25); }
    #jumpBtn::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #ffe066; opacity: 0;
    }
    #jumpBtn.hip::after { animation: hipflash .35s ease-out; }
    @keyframes hipflash { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.5); } }

    /* ---------- タイトル/クリア ---------- */
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(20,30,60,0.55); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      text-align: center; padding: 20px; box-sizing: border-box; touch-action: manipulation;
    }
    #overlay.hidden { display: none; }
    #ovTitle { font-size: 44px; font-weight: 900; letter-spacing: 1px; margin: 0 0 14px; text-shadow: 0 4px 0 #ff3b6b; }
    #ovText { font-size: 16px; line-height: 1.6; margin-bottom: 22px; }
    .howto div { margin: 6px 0; }
    .howto .sub { font-size: 13px; opacity: 0.85; margin-top: 12px; }
    @media (pointer: coarse) { .howto .pc { display: none; } }
    #ovBtn {
      font-size: 22px; font-weight: 900; color: #fff; padding: 14px 44px; border-radius: 999px; border: 0;
      background: #ff3b6b; box-shadow: 0 6px 0 #b0213f; cursor: pointer;
    }
    #ovBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b0213f; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch">
    <div id="stick"><div id="stickKnob"></div></div>
    <div id="jumpBtn">JUMP<small>↓スワイプでヒップ</small></div>
  </div>

  <div id="hud">
    <div id="hp"></div>
    <div id="timer">0.0</div>
    <div id="enemyCount"></div>
  </div>
  <div id="toast"></div>

  <div id="overlay" class="ui-block">
    <div id="ovTitle"></div>
    <div id="ovText"></div>
    <button id="ovBtn"></button>
  </div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
