<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>体当たり戦闘プロトタイプ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #eef1e8;
      font-family: system-ui, sans-serif;
      color: #222;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      touch-action: none;
    }

    #hp {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      font-size: clamp(14px, 4.2vw, 20px);
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      text-align: center;
      padding: 0 24px;
    }
    #overlay.show { display: flex; }
    #overlay h1 { margin: 0; font-size: clamp(26px, 8vw, 38px); }
    #overlay button {
      font-size: clamp(15px, 4.3vw, 17px);
      padding: 10px 28px;
      border-radius: 8px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #eef1e8;
      color: #222;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hp">HP: 3</div>

  <div id="overlay">
    <h1>GAME OVER</h1>
    <button id="restartBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="module" src="main.js"></script>
</body>
</html>
