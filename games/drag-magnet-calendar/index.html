<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Drag &amp; Magnet Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    :root {
      --bg: #f4f6fb;
      --ink: #2b2f3a;
      --ink-soft: rgba(43, 47, 58, 0.55);
      --line: rgba(43, 47, 58, 0.1);
      --accent: #4c7dff;
      --accent-ink: #ffffff;
      --pending: #fff2b8;
      --pending-ink: #6b5a12;
      --panel: #ffffff;
      --shadow: 0 2px 8px rgba(30, 34, 48, 0.1), 0 1px 2px rgba(30, 34, 48, 0.06);
      --shadow-lift: 0 14px 28px rgba(30, 34, 48, 0.22), 0 4px 10px rgba(30, 34, 48, 0.14);
    }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* ---------- 予定の入力 ---------- */
    #topBar {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 8px 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
      z-index: 20;
    }
    #newText {
      flex: 1 1 auto;
      min-width: 0;
      border: none;
      border-radius: 10px;
      background: var(--bg);
      padding: 11px 14px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      touch-action: manipulation;
      -webkit-user-select: text;
      user-select: text;
    }
    #newText::placeholder { color: var(--ink-soft); }
    #addBtn {
      flex: 0 0 auto;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 0 18px;
      touch-action: manipulation;
    }
    #addBtn:active { transform: scale(0.96); }
    #addBtn:disabled { opacity: 0.4; }

    /* ---------- 未配置の予定(待機トレイ) ---------- */
    #pendingTray {
      flex: 0 0 auto;
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      touch-action: pan-x;
      min-height: 72px;
      box-sizing: border-box;
    }
    #pendingHint {
      flex: 1 1 auto;
      align-self: center;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--ink-soft);
      pointer-events: none;
    }

    .card {
      box-sizing: border-box;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.35;
      font-weight: 600;
      box-shadow: var(--shadow);
      touch-action: none;
      cursor: grab;
      word-break: break-word;
    }
    .pendingCard {
      flex: 0 0 auto;
      width: 128px;
      min-height: 52px;
      padding: 9px 11px;
      background: var(--pending);
      color: var(--pending-ink);
      display: flex;
      align-items: center;
      position: relative;
    }
    .scheduledCard {
      position: absolute;
      left: 4px;
      right: 4px;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 5px 8px;
      overflow: hidden;
    }
    .scheduledCard .cardTime {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 1px;
    }
    .card .delBtn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(43, 47, 58, 0.72);
      color: #fff;
      font-size: 12px;
      line-height: 20px;
      text-align: center;
      touch-action: manipulation;
    }

    .card.dragging {
      opacity: 0;
    }
    .card.landed {
      animation: landPulse 0.26s cubic-bezier(0.2, 1.3, 0.4, 1);
    }
    @keyframes landPulse {
      0% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* ---------- ドラッグ中のゴースト(フロート表示) ---------- */
    #dragLayer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9000;
    }
    #ghost {
      position: absolute;
      box-sizing: border-box;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.35;
      font-weight: 600;
      padding: 9px 11px;
      box-shadow: var(--shadow-lift);
      transform: scale(1.05);
      display: none;
    }
    #ghost.show { display: flex; align-items: center; }
    #ghost.pending { background: var(--pending); color: var(--pending-ink); width: 128px; min-height: 52px; }
    #ghost.scheduled { background: var(--accent); color: var(--accent-ink); flex-direction: column; align-items: flex-start; }
    #ghost.snapped { transition: top 0.1s cubic-bezier(0.2, 0.9, 0.3, 1), left 0.15s ease-out, width 0.15s ease-out; }
    #ghost .cardTime { display: block; font-size: 10.5px; font-weight: 700; opacity: 0.85; margin-bottom: 1px; }

    /* ---------- 日付ナビゲーション ---------- */
    #dayNav {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 8px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .navBtn {
      border: none;
      background: var(--bg);
      color: var(--ink);
      width: 34px;
      height: 34px;
      border-radius: 999px;
      font-size: 16px;
      touch-action: manipulation;
    }
    .navBtn:active { transform: scale(0.92); }
    #dayLabel {
      min-width: 150px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }
    #dayLabel .sub { font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-left: 4px; }
    #todayBtn {
      border: none;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 12.5px;
      font-weight: 700;
      touch-action: manipulation;
      padding: 4px 8px;
    }

    /* ---------- カレンダー(時間軸+当日カラム) ---------- */
    #calendarScroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      touch-action: pan-y;
      background: var(--panel);
      position: relative;
    }
    #calendarInner {
      position: relative;
      display: flex;
    }
    #timeAxis {
      flex: 0 0 52px;
      position: relative;
    }
    .hourLabel {
      position: absolute;
      left: 0;
      right: 8px;
      text-align: right;
      font-size: 10.5px;
      color: var(--ink-soft);
      transform: translateY(-50%);
    }
    #dayColumnWrap {
      flex: 1 1 auto;
      position: relative;
      border-left: 1px solid var(--line);
    }
    .hourLine {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px solid var(--line);
    }
    .hourLine.half { border-top-style: dashed; opacity: 0.6; }
    #dayColumn {
      position: absolute;
      inset: 0;
    }
    #nowLine {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ff5a5f;
      z-index: 5;
      pointer-events: none;
    }
    #nowLine::before {
      content: "";
      position: absolute;
      left: -4px;
      top: -3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff5a5f;
    }

    #snapIndicator {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      pointer-events: none;
      display: none;
      z-index: 4;
    }
    #snapIndicator.show { display: block; }

    #unscheduleHint {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 0;
      text-align: center;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--pending-ink);
      background: var(--pending);
      border-radius: 0 0 12px 12px;
      padding: 8px 10px;
      box-shadow: var(--shadow);
      transform: translateY(-110%);
      transition: transform 0.18s ease-out;
      z-index: 50;
      pointer-events: none;
    }
    #unscheduleHint.show { transform: translateY(0); }
  </style>
</head>
<body>
  <div id="app">
    <div id="topBar">
      <input id="newText" type="text" placeholder="予定を入力…(例: 歯医者)" maxlength="60" />
      <button id="addBtn">追加</button>
    </div>

    <div id="pendingTray">
      <div id="pendingHint">入力した予定はここに表示されます。下のカレンダーへドラッグして配置してください</div>
    </div>

    <div id="dayNav">
      <button id="prevDayBtn" class="navBtn">‹</button>
      <div id="dayLabel"></div>
      <button id="nextDayBtn" class="navBtn">›</button>
      <button id="todayBtn">今日</button>
    </div>

    <div id="calendarScroll">
      <div id="calendarInner">
        <div id="timeAxis"></div>
        <div id="dayColumnWrap">
          <div id="dayColumn"></div>
          <div id="snapIndicator"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="unscheduleHint">↑ ここまで持ち上げると未配置に戻ります</div>

  <div id="dragLayer">
    <div id="ghost"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
