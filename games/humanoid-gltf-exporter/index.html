<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Humanoid glTF Exporter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1d22;
      font-family: system-ui, sans-serif;
      color: #eee;
      -webkit-text-size-adjust: 100%;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
    }
    #title {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.8;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    #boneInfo {
      font-size: 12px;
      opacity: 0.85;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      text-align: right;
    }
    #poseBar {
      position: fixed;
      top: max(40px, calc(env(safe-area-inset-top) + 32px));
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20,22,28,0.55);
      border-radius: 999px;
      padding: 8px 12px;
      pointer-events: auto;
    }
    #poseBar select {
      font: inherit;
      font-size: 12px;
      flex: 0 0 auto;
      max-width: 38%;
      background: #2a2e38;
      color: #eee;
      border: none;
      border-radius: 999px;
      padding: 6px 8px;
    }
    #poseBar input[type="range"] {
      flex: 1 1 auto;
      min-width: 0;
    }
    #timeLabel {
      font-size: 11px;
      opacity: 0.8;
      flex: 0 0 auto;
      min-width: 46px;
      text-align: right;
    }
    #controls {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      z-index: 10;
      padding: 0 10px;
    }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    button:active { transform: scale(0.96); }
    #playBtn, #posePlayBtn { background: #3a3f4a; }
    #keyframeBtn { background: #e0634c; }
    #status {
      position: fixed;
      bottom: max(96px, calc(env(safe-area-inset-bottom) + 80px));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      opacity: 0.65;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="title">Humanoid glTF Exporter</div>
    <div id="boneInfo">選択中のボーン<br /><span id="selectedBoneLabel">なし</span></div>
  </div>
  <div id="poseBar">
    <select id="boneSelect">
      <option value="">(ボーン未選択)</option>
    </select>
    <input type="range" id="timeline" min="0" max="5" step="0.01" value="0" />
    <span id="timeLabel">0.00s</span>
  </div>
  <div id="status">タップでボーン選択・ドラッグで回転</div>
  <div id="controls">
    <button id="playBtn">お辞儀アニメーション再生</button>
    <button id="keyframeBtn">キーフレーム追加</button>
    <button id="posePlayBtn">ポーズ再生</button>
    <button id="exportBtn">GLTFを書き出す(.glb)</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
