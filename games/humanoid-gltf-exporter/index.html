<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Humanoid glTF Exporter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1d22;
      font-family: system-ui, sans-serif;
      color: #eee;
      -webkit-text-size-adjust: 100%;
    }
    canvas { display: block; touch-action: none; }

    /* ---------- 全体レイアウト ----------
       3Dビュー領域とタイムライン領域を、z-indexの重ね合わせではなく
       実際のドキュメントフロー(flex column)で完全に分離する。
       これにより、お互いの領域は物理的に重ならず、タッチイベントも
       それぞれ別のDOM要素にのみ送られる */
    #appRoot {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
    }
    #viewportArea {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    #viewportArea canvas#game {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    #title {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.8;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      padding-top: 6px;
    }
    #hudRight {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      pointer-events: auto;
    }
    #boneInfo {
      font-size: 11px;
      opacity: 0.85;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      text-align: right;
      padding-top: 6px;
    }
    #exportBtn {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: #4c8dff;
      color: white;
      font-size: 16px;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }
    #exportBtn:active { transform: scale(0.94); }

    /* poseBarは3Dビュー上の一部にしか置かないよう、左上に小さく収める
       (全幅に広げると、その帯の下にある3Dビューへのタップを奪ってしまうため) */
    #poseBar {
      position: absolute;
      top: max(52px, calc(env(safe-area-inset-top) + 44px));
      left: 10px;
      max-width: min(58%, 220px);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(20,22,28,0.55);
      border-radius: 999px;
      padding: 6px 10px;
      pointer-events: auto;
    }
    #poseBar select {
      font: inherit;
      font-size: 11px;
      flex: 1 1 auto;
      min-width: 0;
      background: #2a2e38;
      color: #eee;
      border: none;
      border-radius: 999px;
      padding: 5px 8px;
    }

    #status {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ---------- 4分割ビュー(TOP/FRONT/LEFT/FREE CAMERA) ---------- */
    #viewGrid {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      pointer-events: none;
    }
    .viewCell {
      border: 1px solid rgba(255,255,255,0.14);
      box-sizing: border-box;
      position: relative;
      transition: border-color 0.15s;
    }
    .viewCell.active {
      border-color: rgba(255,210,76,0.85);
    }
    .viewCell .viewLabel {
      position: absolute;
      left: 6px;
      bottom: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0.55;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .viewCell.active .viewLabel { opacity: 0.95; color: #ffd24c; }

    /* ---------- タイムラインドック(3Dビューとは別領域。縦方向を極力圧縮) ----------
       タイムラインのタッチ操作はこの領域のDOM要素だけが受け取り、下にある
       3Dビュー用canvasには一切イベントが伝わらない(別要素・別領域のため) */
    #timelineDock {
      flex: 0 0 auto;
      background: #14161b;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 4px 10px max(6px, env(safe-area-inset-bottom)) 10px;
      touch-action: none;
    }
    #timelineReadout {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      padding: 2px 2px 0;
    }
    #frameReadout {
      font-weight: 700;
      font-size: 13px;
      color: #ffd24c;
    }
    #timeReadout {
      opacity: 0.7;
      font-size: 10px;
    }
    #timelineCanvas {
      display: block;
      width: 100%;
      height: 30px;
      touch-action: none;
    }
    #timelineButtons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-top: 2px;
    }
    .iconBtn {
      font: inherit;
      font-size: 16px;
      min-width: 44px;
      min-height: 36px;
      padding: 4px 10px;
      border-radius: 10px;
      border: none;
      background: #2a2e38;
      color: #eee;
      touch-action: manipulation;
      line-height: 1;
    }
    .iconBtn:active { transform: scale(0.94); }
    #keyframeBtn { background: #e0634c; font-weight: 700; }
    #posePlayBtn, #posePauseBtn { background: #3a3f4a; }
  </style>
</head>
<body>
  <div id="appRoot">
    <div id="viewportArea">
      <canvas id="game"></canvas>

      <div id="viewGrid">
        <div class="viewCell" data-view="top"><span class="viewLabel">TOP</span></div>
        <div class="viewCell" data-view="front"><span class="viewLabel">FRONT</span></div>
        <div class="viewCell" data-view="left"><span class="viewLabel">LEFT</span></div>
        <div class="viewCell" data-view="free"><span class="viewLabel">FREE CAMERA</span></div>
      </div>

      <div id="hud">
        <div id="title">Humanoid glTF Exporter</div>
        <div id="hudRight">
          <div id="boneInfo">選択中のボーン<br /><span id="selectedBoneLabel">なし</span></div>
          <button id="exportBtn" title="GLBを書き出す">⇩</button>
        </div>
      </div>
      <div id="poseBar">
        <select id="boneSelect">
          <option value="">(ボーン未選択)</option>
        </select>
      </div>
      <div id="status">タップでボーン選択・ドラッグで回転</div>
    </div>

    <div id="timelineDock">
      <div id="timelineReadout">
        <span id="frameReadout">Frame: 0 / 60</span>
        <span id="timeReadout">Time: 0.000s</span>
      </div>
      <canvas id="timelineCanvas"></canvas>
      <div id="timelineButtons">
        <button id="keyframeBtn" class="iconBtn">+◆</button>
        <button id="posePlayBtn" class="iconBtn">▶</button>
        <button id="posePauseBtn" class="iconBtn">⏸</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
