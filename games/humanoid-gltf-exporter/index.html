<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Humanoid glTF Exporter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1d22;
      font-family: system-ui, sans-serif;
      color: #eee;
      -webkit-text-size-adjust: 100%;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
    }
    #title {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.8;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    #controls {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }
    button {
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 20px;
      border-radius: 999px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    button:active { transform: scale(0.96); }
    #playBtn { background: #3a3f4a; }
    #status {
      position: fixed;
      bottom: max(70px, calc(env(safe-area-inset-bottom) + 54px));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      opacity: 0.65;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="title">Humanoid glTF Exporter</div>
  </div>
  <div id="status">ドラッグで視点回転・ピンチでズーム</div>
  <div id="controls">
    <button id="playBtn">アニメーション停止</button>
    <button id="exportBtn">GLTFを書き出す(.glb)</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
