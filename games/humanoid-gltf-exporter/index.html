<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Humanoid glTF Exporter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1d22;
      font-family: system-ui, sans-serif;
      color: #eee;
      -webkit-text-size-adjust: 100%;
    }
    canvas { display: block; touch-action: none; }

    /* ---------- モバイルでのテキスト選択/コンテキストメニュー抑制 ----------
       スマートフォンのSafari/Chromeで、タイムラインや3Dビューをドラッグ操作
       している最中に、ブラウザ標準のテキスト選択(「コピー」「Googleで検索」
       等のメニュー)や長押しのコールアウトメニューが表示されてしまう問題を
       防ぐため、アプリのUI全体をuser-select:noneにする。
       ただし、実際に文字入力する要素(input/textarea。今回は
       #animNameInputのみ)は対象から除外し、通常のテキスト選択・コピー
       操作を維持する */
    #appRoot, #appRoot * {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none; /* iOS Safariの長押しコールアウト(コピー等)を抑制 */
    }
    #appRoot input,
    #appRoot textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* ---------- 全体レイアウト ----------
       3Dビュー領域とタイムライン領域を、z-indexの重ね合わせではなく
       実際のドキュメントフロー(flex column)で完全に分離する。
       これにより、お互いの領域は物理的に重ならず、タッチイベントも
       それぞれ別のDOM要素にのみ送られる */
    #appRoot {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100svh;
    }
    #viewportArea {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    #viewportArea canvas#game {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    #hudRight {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      pointer-events: auto;
    }
    /* 「選択中のボーン」表示は、タイムラインドックのボーン選択(boneSelect)が
       同じ情報を常に示しているため、3Dビューを覆わないよう非表示にしている
       (main.jsが更新するselectedBoneLabel要素自体は互換のため残す) */
    #boneInfo { display: none; }
    #fileMenuBtn {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 16px;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }
    #fileMenuBtn { background: #4c8dff; }
    #fileMenuBtn:active { transform: scale(0.94); }
    #fileMenuBtn.active { box-shadow: 0 0 0 2px #ffd24c, 0 3px 10px rgba(0,0,0,0.4); }

    /* ファイルメニュー: モデルの読み込み・書き出し、モーションの読み込み・書き出しを
       すべて右上の⇩ボタン1つにまとめた(以前は📥・🥊・🎞・⇩の4ボタン+
       アニメーション管理パネルだった)。⇩を押すと開き、操作を選ぶか、メニューの
       外をタップすると閉じる。普段は非表示にして3Dビューを覆わない */
    #fileMenu {
      position: absolute;
      top: max(60px, calc(env(safe-area-inset-top) + 52px));
      right: 10px;
      width: min(80%, 280px);
      z-index: 10;
      display: none;
      flex-direction: column;
      gap: 6px;
      background: rgba(20,22,28,0.94);
      border-radius: 14px;
      padding: 10px;
      pointer-events: auto;
      font-size: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }
    #fileMenu.open { display: flex; }
    #fileMenu .menuSection { font-weight: 700; opacity: 0.7; font-size: 11px; margin-top: 4px; letter-spacing: 0.04em; }
    #fileMenu .menuSection:first-child { margin-top: 0; }
    #fileMenu .menuRow { display: flex; gap: 6px; align-items: center; }
    #fileMenu input[type="text"], #fileMenu select {
      font: inherit;
      font-size: 13px;
      flex: 1 1 auto;
      min-width: 0;
      background: #2a2e38;
      color: #eee;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      touch-action: manipulation;
    }
    #fileMenu button {
      font: inherit;
      font-size: 13px;
      min-height: 40px;
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      background: #3a3f4a;
      color: #eee;
      text-align: left;
      touch-action: manipulation;
    }
    #fileMenu .menuRow button { flex: 0 0 auto; text-align: center; }
    #fileMenu button:active { transform: scale(0.97); }

    /* ボーン選択とPOSE/MOVE切替は、以前は3Dビュー左上に重ねていたが、
       TOPビューの作業領域を覆ってしまうため、タイムラインドックの
       読み出し行(Frame表示とTime表示の間)へ移した */
    #poseBar {
      min-width: 0;
      display: flex;
      align-items: center;
    }
    #poseBar select {
      font: inherit;
      font-size: 11px;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 180px;
      background: #2a2e38;
      color: #eee;
      border: none;
      border-radius: 999px;
      padding: 5px 8px;
      touch-action: manipulation;
    }

    /* [POSE]/[MOVE]モード切替(poseBarと同じくタイムラインドックの読み出し行) */
    #modeBar {
      display: flex;
      gap: 2px;
      background: #2a2e38;
      border-radius: 999px;
      padding: 2px;
    }
    .modeBtn {
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 4px 10px;
      min-height: 30px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: rgba(255,255,255,0.55);
      touch-action: manipulation;
    }
    .modeBtn.active {
      background: #4c8dff;
      color: #fff;
    }
    .modeBtn:active { transform: scale(0.95); }

    #status {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ---------- 4分割ビュー(TOP/FRONT/LEFT/FREE CAMERA) ---------- */
    #viewGrid {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      pointer-events: none;
    }
    .viewCell {
      border: 1px solid rgba(255,255,255,0.14);
      box-sizing: border-box;
      position: relative;
      transition: border-color 0.15s;
    }
    .viewCell.active {
      border-color: rgba(255,210,76,0.85);
    }
    .viewCell .viewLabel {
      position: absolute;
      left: 6px;
      bottom: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0.55;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .viewCell.active .viewLabel { opacity: 0.95; color: #ffd24c; }

    /* ---------- タイムラインドック(3Dビューとは別領域。縦方向を極力圧縮) ----------
       タイムラインのタッチ操作はこの領域のDOM要素だけが受け取り、下にある
       3Dビュー用canvasには一切イベントが伝わらない(別要素・別領域のため) */
    #timelineDock {
      flex: 0 0 auto;
      box-sizing: border-box; /* JSから設定するstyle.heightがborder/paddingを
        含んだ実高さ(getBoundingClientRectと同じ基準)と一致するようにする */
      background: #14161b;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 4px 10px max(6px, env(safe-area-inset-bottom)) 10px;
      touch-action: none;
      overflow: hidden; /* 高さを伸縮しても内部要素がはみ出さないようにする保険 */
    }
    /* 左列にFrame/Timeを上下2段で置き、残りの横幅をボーン選択とPOSE/MOVE
       切替に使う(幅の狭いスマートフォンでもボーン名が読める幅を確保する) */
    #timelineReadout {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 8px;
      font-size: 11px;
      padding: 2px 2px 0;
    }
    #frameReadout { grid-column: 1; grid-row: 1; white-space: nowrap; }
    #timeReadout { grid-column: 1; grid-row: 2; white-space: nowrap; }
    #poseBar { grid-column: 2; grid-row: 1 / span 2; }
    #modeBar { grid-column: 3; grid-row: 1 / span 2; }
    #frameReadout {
      font-weight: 700;
      font-size: 13px;
      color: #ffd24c;
    }
    #timeReadout {
      opacity: 0.7;
      font-size: 10px;
    }
    #timelineButtons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-top: 2px;
      margin-bottom: 10px; /* ボタン群とタイムライン目盛りの間の余白(視覚的に少し分離する) */
    }
    #timelineCanvas {
      display: block;
      width: 100%;
      height: 30px; /* 初期値。以後はタイムラインの伸縮ドラッグに応じてJSが上書きする */
      touch-action: none;
    }

    /* ---------- タイムラインの高さを伸縮するドラッグハンドル ----------
       4分割ビューとタイムラインの境界をドラッグすると、タイムライン全体の
       高さを変更できる。「見た目の境界線は太くしないが、指で掴みやすい
       十分な高さの当たり判定を確保する」という要件のため、要素自体の
       高さ(36px)をmargin-top/bottomの負値(-18px)で相殺し、レイアウト上は
       占有スペース0のまま、視覚的な境界線の上下にまたがる当たり判定だけを
       重ねて配置している */
    #timelineResizeHandle {
      flex: 0 0 auto;
      position: relative;
      z-index: 5;
      height: 36px;
      margin-top: -18px;
      margin-bottom: -18px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: ns-resize;
    }
    #timelineResizeHandle .resizeGripBar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.25);
    }
    .iconBtn {
      font: inherit;
      font-size: 16px;
      min-width: 44px;
      min-height: 36px;
      padding: 4px 10px;
      border-radius: 10px;
      border: none;
      background: #2a2e38;
      color: #eee;
      touch-action: manipulation;
      line-height: 1;
    }
    .iconBtn:active { transform: scale(0.94); }
    .iconBtn:disabled { opacity: 0.35; }
    #keyframeBtn { background: #e0634c; font-weight: 700; }
    #posePlayBtn, #posePauseBtn { background: #3a3f4a; }
    #copyPoseBtn, #pastePoseBtn { background: #2f5d8a; }
    #deleteKeyframeBtn { background: #7a3030; }
    #undoBtn { background: #4a4e5c; }
  </style>
</head>
<body>
  <div id="appRoot">
    <div id="viewportArea">
      <canvas id="game"></canvas>

      <div id="viewGrid">
        <div class="viewCell" data-view="top"><span class="viewLabel">TOP</span></div>
        <div class="viewCell" data-view="front"><span class="viewLabel">FRONT</span></div>
        <div class="viewCell" data-view="left"><span class="viewLabel">LEFT</span></div>
        <div class="viewCell" data-view="free"><span class="viewLabel">FREE CAMERA</span></div>
      </div>

      <div id="hud">
        <div id="hudRight">
          <div id="boneInfo">選択中のボーン<br /><span id="selectedBoneLabel">なし</span></div>
          <button id="fileMenuBtn" title="ファイル(モデル・モーションの読み込みと書き出し)">⇩</button>
        </div>
      </div>
      <!-- ファイルメニュー(右上の⇩ボタンで開閉)。
           モデル(3Dモデル: メッシュ・マテリアル・ボーン構造)とモーション(ボーン名ごとの
           キーフレーム。モデルとは別データ)の読み込み・書き出しを、ここに集約している。
           モーションはボーン名だけに依存した形式なので、同じボーン構成の別モデルにも流用できる -->
      <div id="fileMenu">
        <div class="menuSection">モデル</div>
        <button id="modelImportBtn" title="GLB/glTFモデルを読み込む(現在のモデルと差し替え。ボーン名・本数は問わない)">📥 モデルを読み込む(GLB)</button>
        <button id="modelExportBtn" title="3Dモデルを書き出す(.glb / メッシュ・マテリアル・ボーン構造のみ)">⇩ モデルを書き出す(GLB)</button>
        <input type="file" id="importModelFile" accept=".glb,.gltf,model/gltf-binary" style="display:none" />
        <div class="menuSection">モーション</div>
        <button id="animImportBtn" title="モーションJSONを読み込む">📥 モーションを読み込む(JSON)</button>
        <input type="file" id="animImportFile" accept="application/json" style="display:none" />
        <div class="menuRow">
          <select id="animSelect">
            <option value="">(モーションなし)</option>
          </select>
          <button id="animLoadBtn" title="選んだモーションをタイムラインへ読み込む">開く</button>
        </div>
        <div class="menuRow">
          <input type="text" id="animNameInput" placeholder="モーション名(ファイル名)" />
          <button id="animExportBtn" title="現在のタイムラインをモーションJSONとして書き出す">💾 書き出し</button>
        </div>
      </div>

      <div id="status">タップでボーン選択・ドラッグで回転</div>
    </div>

    <!-- 4分割ビューとタイムラインの境界。ドラッグするとタイムラインの
         高さを伸縮できる(上へドラッグで拡大、下へドラッグで縮小) -->
    <div id="timelineResizeHandle"><span class="resizeGripBar"></span></div>

    <div id="timelineDock">
      <div id="timelineReadout">
        <span id="frameReadout">Frame: 0 / 60</span>
        <div id="poseBar">
          <select id="boneSelect">
            <option value="">(ボーン未選択)</option>
          </select>
        </div>
        <!-- POSE: 選択した関節を3軸回転させる(既存の操作)。
             MOVE: 現在のポーズ(各ボーンの回転・キーフレーム)を一切変更せず、
             モデル全体(ModelTransform)の位置だけをドラッグで移動する -->
        <div id="modeBar">
          <button id="modePoseBtn" class="modeBtn active">POSE</button>
          <button id="modeMoveBtn" class="modeBtn">MOVE</button>
        </div>
        <span id="timeReadout">Time: 0.000s</span>
      </div>
      <div id="timelineButtons">
        <button id="keyframeBtn" class="iconBtn">+◆</button>
        <button id="posePlayBtn" class="iconBtn">▶</button>
        <button id="posePauseBtn" class="iconBtn">⏸</button>
        <button id="copyPoseBtn" class="iconBtn" title="現在のポーズをコピー">📋</button>
        <button id="pastePoseBtn" class="iconBtn" title="コピーしたポーズを貼り付け" disabled>📌</button>
        <button id="deleteKeyframeBtn" class="iconBtn" title="選択したキーフレームを削除" disabled>🗑</button>
        <button id="undoBtn" class="iconBtn" title="元に戻す(Undo)" disabled>↩</button>
      </div>
      <!-- タイムラインバーは常にボタン群の下(=3Dビューから最も遠い、最下段)に
           独立して配置し、キーフレーム♦の確認・タップ・ドラッグ移動を
           最優先でき、ボタン領域と重ならないようにしている -->
      <canvas id="timelineCanvas"></canvas>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
