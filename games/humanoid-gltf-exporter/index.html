<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Humanoid glTF Exporter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1d22;
      font-family: system-ui, sans-serif;
      color: #eee;
      -webkit-text-size-adjust: 100%;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
    }
    #title {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.8;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    #boneInfo {
      font-size: 12px;
      opacity: 0.85;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      text-align: right;
    }
    #poseBar {
      position: fixed;
      top: max(40px, calc(env(safe-area-inset-top) + 32px));
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20,22,28,0.55);
      border-radius: 999px;
      padding: 8px 12px;
      pointer-events: auto;
    }
    #poseBar select {
      font: inherit;
      font-size: 12px;
      flex: 1 1 auto;
      min-width: 0;
      background: #2a2e38;
      color: #eee;
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
    }

    /* ---------- 4分割ビュー(TOP/FRONT/LEFT/FREE CAMERA) ---------- */
    #viewGrid {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      pointer-events: none;
    }
    .viewCell {
      border: 1px solid rgba(255,255,255,0.14);
      box-sizing: border-box;
      position: relative;
      transition: border-color 0.15s;
    }
    .viewCell.active {
      border-color: rgba(255,210,76,0.85);
    }
    .viewCell .viewLabel {
      position: absolute;
      left: 6px;
      bottom: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0.55;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .viewCell.active .viewLabel { opacity: 0.95; color: #ffd24c; }

    /* ---------- タイムライン(フレーム単位) ---------- */
    #timelinePanel {
      position: fixed;
      bottom: max(72px, calc(env(safe-area-inset-bottom) + 60px));
      left: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(20,22,28,0.65);
      border-radius: 14px;
      padding: 6px 10px 8px;
    }
    #timelineReadout {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      padding: 0 2px 2px;
    }
    #frameReadout {
      font-weight: 700;
      font-size: 14px;
      color: #ffd24c;
    }
    #timeReadout {
      opacity: 0.7;
      font-size: 11px;
    }
    #timelineCanvas {
      display: block;
      width: 100%;
      height: 46px;
      touch-action: none;
    }
    #controls {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      z-index: 10;
      padding: 0 10px;
    }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    button:active { transform: scale(0.96); }
    #playBtn, #posePlayBtn { background: #3a3f4a; }
    #keyframeBtn { background: #e0634c; }
    #status {
      position: fixed;
      bottom: max(176px, calc(env(safe-area-inset-bottom) + 140px));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      opacity: 0.65;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="viewGrid">
    <div class="viewCell" data-view="top"><span class="viewLabel">TOP</span></div>
    <div class="viewCell" data-view="front"><span class="viewLabel">FRONT</span></div>
    <div class="viewCell" data-view="left"><span class="viewLabel">LEFT</span></div>
    <div class="viewCell" data-view="free"><span class="viewLabel">FREE CAMERA</span></div>
  </div>

  <div id="hud">
    <div id="title">Humanoid glTF Exporter</div>
    <div id="boneInfo">選択中のボーン<br /><span id="selectedBoneLabel">なし</span></div>
  </div>
  <div id="poseBar">
    <select id="boneSelect">
      <option value="">(ボーン未選択)</option>
    </select>
  </div>
  <div id="status">タップでボーン選択・ドラッグで回転</div>
  <div id="timelinePanel">
    <div id="timelineReadout">
      <span id="frameReadout">Frame: 0 / 60</span>
      <span id="timeReadout">Time: 0.000s</span>
    </div>
    <canvas id="timelineCanvas"></canvas>
  </div>
  <div id="controls">
    <button id="playBtn">お辞儀アニメーション再生</button>
    <button id="keyframeBtn">キーフレーム追加</button>
    <button id="posePlayBtn">ポーズ再生</button>
    <button id="exportBtn">GLTFを書き出す(.glb)</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
