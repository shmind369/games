<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Humanoid glTF Exporter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1a1d22;
      font-family: system-ui, sans-serif;
      color: #eee;
      -webkit-text-size-adjust: 100%;
    }
    canvas { display: block; touch-action: none; }

    /* ---------- モバイルでのテキスト選択/コンテキストメニュー抑制 ----------
       スマートフォンのSafari/Chromeで、タイムラインや3Dビューをドラッグ操作
       している最中に、ブラウザ標準のテキスト選択(「コピー」「Googleで検索」
       等のメニュー)や長押しのコールアウトメニューが表示されてしまう問題を
       防ぐため、アプリのUI全体をuser-select:noneにする。
       ただし、実際に文字入力する要素(input/textarea。今回は
       #animNameInputのみ)は対象から除外し、通常のテキスト選択・コピー
       操作を維持する */
    #appRoot, #appRoot * {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none; /* iOS Safariの長押しコールアウト(コピー等)を抑制 */
    }
    #appRoot input,
    #appRoot textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* ---------- 全体レイアウト ----------
       3Dビュー領域とタイムライン領域を、z-indexの重ね合わせではなく
       実際のドキュメントフロー(flex column)で完全に分離する。
       これにより、お互いの領域は物理的に重ならず、タッチイベントも
       それぞれ別のDOM要素にのみ送られる */
    #appRoot {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100svh;
    }
    #viewportArea {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    #viewportArea canvas#game {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    #title {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.8;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      padding-top: 6px;
    }
    #hudRight {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      pointer-events: auto;
    }
    #boneInfo {
      font-size: 11px;
      opacity: 0.85;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      text-align: right;
      padding-top: 6px;
    }
    #exportBtn, #animMenuBtn, #importModelBtn, #resetModelBtn {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 16px;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
      touch-action: manipulation;
    }
    #exportBtn { background: #4c8dff; }
    #animMenuBtn { background: #8a5cf5; }
    #importModelBtn { background: #2f8f5f; }
    #resetModelBtn { background: #555b6a; }
    #exportBtn:active, #animMenuBtn:active, #importModelBtn:active, #resetModelBtn:active { transform: scale(0.94); }
    #animMenuBtn.active { box-shadow: 0 0 0 2px #ffd24c, 0 3px 10px rgba(0,0,0,0.4); }

    /* アニメーション管理パネル: 3Dモデル(メッシュ・マテリアル・ボーン構造)と
       アニメーション(ボーン名ごとのキーフレーム)を別データとして扱うための
       保存・読込・書き出し・読み込みUI。既存のタイムライン/ギズモ領域とは
       独立しており、普段は非表示(animMenuBtnで開閉)にして画面を圧迫しない */
    #animPanel {
      position: absolute;
      top: max(52px, calc(env(safe-area-inset-top) + 44px));
      right: 10px;
      max-width: min(70%, 260px);
      z-index: 10;
      display: none;
      flex-direction: column;
      gap: 6px;
      background: rgba(20,22,28,0.9);
      border-radius: 14px;
      padding: 10px;
      pointer-events: auto;
      font-size: 11px;
    }
    #animPanel.open { display: flex; }
    #animPanel .animTitle { font-weight: 700; opacity: 0.85; }
    #animPanel .animRow { display: flex; gap: 4px; align-items: center; }
    #animPanel input[type="text"], #animPanel select {
      font: inherit;
      font-size: 11px;
      flex: 1 1 auto;
      min-width: 0;
      background: #2a2e38;
      color: #eee;
      border: none;
      border-radius: 8px;
      padding: 6px 8px;
      touch-action: manipulation;
    }
    #animPanel button {
      font: inherit;
      font-size: 13px;
      flex: 0 0 auto;
      min-width: 36px;
      min-height: 32px;
      padding: 4px 8px;
      border: none;
      border-radius: 8px;
      background: #3a3f4a;
      color: #eee;
      touch-action: manipulation;
    }
    #animPanel button:active { transform: scale(0.94); }

    /* poseBarは3Dビュー上の一部にしか置かないよう、左上に小さく収める
       (全幅に広げると、その帯の下にある3Dビューへのタップを奪ってしまうため) */
    #poseBar {
      position: absolute;
      top: max(52px, calc(env(safe-area-inset-top) + 44px));
      left: 10px;
      max-width: min(58%, 220px);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(20,22,28,0.55);
      border-radius: 999px;
      padding: 6px 10px;
      pointer-events: auto;
    }
    #poseBar select {
      font: inherit;
      font-size: 11px;
      flex: 1 1 auto;
      min-width: 0;
      background: #2a2e38;
      color: #eee;
      border: none;
      border-radius: 999px;
      padding: 5px 8px;
      touch-action: manipulation;
    }

    /* [POSE]/[MOVE]モード切替。poseBarと同様、左上に小さく収めて
       3Dビューへのタップを奪わないようにする */
    #modeBar {
      position: absolute;
      top: max(92px, calc(env(safe-area-inset-top) + 84px));
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 3px;
      background: rgba(20,22,28,0.55);
      border-radius: 999px;
      padding: 4px;
      pointer-events: auto;
    }
    .modeBtn {
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 6px 12px;
      min-height: 32px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: rgba(255,255,255,0.55);
      touch-action: manipulation;
    }
    .modeBtn.active {
      background: #4c8dff;
      color: #fff;
    }
    .modeBtn:active { transform: scale(0.95); }

    #status {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      opacity: 0.6;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ---------- 4分割ビュー(TOP/FRONT/LEFT/FREE CAMERA) ---------- */
    #viewGrid {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      pointer-events: none;
    }
    .viewCell {
      border: 1px solid rgba(255,255,255,0.14);
      box-sizing: border-box;
      position: relative;
      transition: border-color 0.15s;
    }
    .viewCell.active {
      border-color: rgba(255,210,76,0.85);
    }
    .viewCell .viewLabel {
      position: absolute;
      left: 6px;
      bottom: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0.55;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .viewCell.active .viewLabel { opacity: 0.95; color: #ffd24c; }

    /* ---------- タイムラインドック(3Dビューとは別領域。縦方向を極力圧縮) ----------
       タイムラインのタッチ操作はこの領域のDOM要素だけが受け取り、下にある
       3Dビュー用canvasには一切イベントが伝わらない(別要素・別領域のため) */
    #timelineDock {
      flex: 0 0 auto;
      box-sizing: border-box; /* JSから設定するstyle.heightがborder/paddingを
        含んだ実高さ(getBoundingClientRectと同じ基準)と一致するようにする */
      background: #14161b;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 4px 10px max(6px, env(safe-area-inset-bottom)) 10px;
      touch-action: none;
      overflow: hidden; /* 高さを伸縮しても内部要素がはみ出さないようにする保険 */
    }
    #timelineReadout {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      padding: 2px 2px 0;
    }
    #frameReadout {
      font-weight: 700;
      font-size: 13px;
      color: #ffd24c;
    }
    #timeReadout {
      opacity: 0.7;
      font-size: 10px;
    }
    #timelineButtons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-top: 2px;
      margin-bottom: 10px; /* ボタン群とタイムライン目盛りの間の余白(視覚的に少し分離する) */
    }
    #timelineCanvas {
      display: block;
      width: 100%;
      height: 30px; /* 初期値。以後はタイムラインの伸縮ドラッグに応じてJSが上書きする */
      touch-action: none;
    }

    /* ---------- タイムラインの高さを伸縮するドラッグハンドル ----------
       4分割ビューとタイムラインの境界をドラッグすると、タイムライン全体の
       高さを変更できる。「見た目の境界線は太くしないが、指で掴みやすい
       十分な高さの当たり判定を確保する」という要件のため、要素自体の
       高さ(36px)をmargin-top/bottomの負値(-18px)で相殺し、レイアウト上は
       占有スペース0のまま、視覚的な境界線の上下にまたがる当たり判定だけを
       重ねて配置している */
    #timelineResizeHandle {
      flex: 0 0 auto;
      position: relative;
      z-index: 5;
      height: 36px;
      margin-top: -18px;
      margin-bottom: -18px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: ns-resize;
    }
    #timelineResizeHandle .resizeGripBar {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.25);
    }
    .iconBtn {
      font: inherit;
      font-size: 16px;
      min-width: 44px;
      min-height: 36px;
      padding: 4px 10px;
      border-radius: 10px;
      border: none;
      background: #2a2e38;
      color: #eee;
      touch-action: manipulation;
      line-height: 1;
    }
    .iconBtn:active { transform: scale(0.94); }
    .iconBtn:disabled { opacity: 0.35; }
    #keyframeBtn { background: #e0634c; font-weight: 700; }
    #posePlayBtn, #posePauseBtn { background: #3a3f4a; }
    #copyPoseBtn, #pastePoseBtn { background: #2f5d8a; }
    #deleteKeyframeBtn { background: #7a3030; }
    #undoBtn { background: #4a4e5c; }
  </style>
</head>
<body>
  <div id="appRoot">
    <div id="viewportArea">
      <canvas id="game"></canvas>

      <div id="viewGrid">
        <div class="viewCell" data-view="top"><span class="viewLabel">TOP</span></div>
        <div class="viewCell" data-view="front"><span class="viewLabel">FRONT</span></div>
        <div class="viewCell" data-view="left"><span class="viewLabel">LEFT</span></div>
        <div class="viewCell" data-view="free"><span class="viewLabel">FREE CAMERA</span></div>
      </div>

      <div id="hud">
        <div id="title">Humanoid glTF Exporter</div>
        <div id="hudRight">
          <div id="boneInfo">選択中のボーン<br /><span id="selectedBoneLabel">なし</span></div>
          <button id="importModelBtn" title="GLB/glTFモデルを読み込む(現在のモデルと差し替え。ボーン名・本数は問わない)">📥</button>
          <button id="resetModelBtn" title="ボクサーモデルに戻す">🥊</button>
          <input type="file" id="importModelFile" accept=".glb,.gltf,model/gltf-binary" style="display:none" />
          <button id="animMenuBtn" title="アニメーション管理(モデルとは別データとして保存・書き出し)">🎞</button>
          <button id="exportBtn" title="3Dモデルを書き出す(.glb / メッシュ・マテリアル・ボーン構造のみ)">⇩</button>
        </div>
      </div>
      <div id="poseBar">
        <select id="boneSelect">
          <option value="">(ボーン未選択)</option>
        </select>
      </div>
      <!-- POSE: 選択した関節を3軸回転させる(既存の操作)。
           MOVE: 現在のポーズ(各ボーンの回転・キーフレーム)を一切変更せず、
           モデル全体(ModelTransform)の位置だけをドラッグで移動する -->
      <div id="modeBar">
        <button id="modePoseBtn" class="modeBtn active">POSE</button>
        <button id="modeMoveBtn" class="modeBtn">MOVE</button>
      </div>

      <!-- アニメーション管理パネル: 3Dモデル(character.glb)とは別データとして、
           ボーン名・キーフレーム・FPS・アニメーション長だけを持つ「アニメーション」を
           複数名前付きで保存・切替・書き出し(.json)・読み込み(.json)できるようにする。
           ボーン名だけに依存した形式なので、同じボーン構成の別モデルにも流用できる -->
      <div id="animPanel">
        <div class="animTitle">アニメーション管理(モデルとは別データ)</div>
        <div class="animRow">
          <input type="text" id="animNameInput" placeholder="アニメーション名" />
          <button id="animSaveBtn" title="現在のタイムラインを名前付きアニメーションとして保存">💾</button>
        </div>
        <div class="animRow">
          <select id="animSelect">
            <option value="">(保存されたアニメーションなし)</option>
          </select>
          <button id="animLoadBtn" title="選択したアニメーションをタイムラインへ読込">📂</button>
        </div>
        <div class="animRow">
          <button id="animExportBtn" title="現在のタイムラインをアニメーションJSONとして書き出す">📤 書き出し</button>
          <button id="animImportBtn" title="アニメーションJSONを読み込む">📥 読み込み</button>
          <input type="file" id="animImportFile" accept="application/json" style="display:none" />
        </div>
      </div>

      <div id="status">タップでボーン選択・ドラッグで回転</div>
    </div>

    <!-- 4分割ビューとタイムラインの境界。ドラッグするとタイムラインの
         高さを伸縮できる(上へドラッグで拡大、下へドラッグで縮小) -->
    <div id="timelineResizeHandle"><span class="resizeGripBar"></span></div>

    <div id="timelineDock">
      <div id="timelineReadout">
        <span id="frameReadout">Frame: 0 / 60</span>
        <span id="timeReadout">Time: 0.000s</span>
      </div>
      <div id="timelineButtons">
        <button id="keyframeBtn" class="iconBtn">+◆</button>
        <button id="posePlayBtn" class="iconBtn">▶</button>
        <button id="posePauseBtn" class="iconBtn">⏸</button>
        <button id="copyPoseBtn" class="iconBtn" title="現在のポーズをコピー">📋</button>
        <button id="pastePoseBtn" class="iconBtn" title="コピーしたポーズを貼り付け" disabled>📌</button>
        <button id="deleteKeyframeBtn" class="iconBtn" title="選択したキーフレームを削除" disabled>🗑</button>
        <button id="undoBtn" class="iconBtn" title="元に戻す(Undo)" disabled>↩</button>
      </div>
      <!-- タイムラインバーは常にボタン群の下(=3Dビューから最も遠い、最下段)に
           独立して配置し、キーフレーム♦の確認・タップ・ドラッグ移動を
           最優先でき、ボタン領域と重ならないようにしている -->
      <canvas id="timelineCanvas"></canvas>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
