<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Corridor Walk 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0a0a0a;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    #bgPhoto {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 1;
    }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
      z-index: 2;
    }
    #joystickArea {
      position: fixed;
      inset: 0;
      z-index: 5;
      touch-action: none;
    }
    #stick {
      position: fixed;
      z-index: 6;
      width: 96px;
      height: 96px;
      margin-left: -48px;
      margin-top: -48px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.08);
      display: none;
      pointer-events: none;
    }
    #stickKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      margin-top: -20px;
      border-radius: 999px;
      background: rgba(255,255,255,0.55);
    }
    #topBar {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: flex-end;
    }
    .btn {
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.45);
      color: #eee;
      touch-action: manipulation;
    }
    .btn:active { background: rgba(0,0,0,0.65); }

    #hint {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.75;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #0a0a0a;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <img id="bgPhoto" src="assets/room.jpg" alt="" />
  <canvas id="game"></canvas>
  <div id="joystickArea"></div>
  <div id="stick"><div id="stickKnob"></div></div>

  <div id="topBar">
    <button id="resetBtn" class="btn">リセット</button>
  </div>
  <div id="hint">ドラッグで操作(左右で旋回・上下で前進後退)</div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
