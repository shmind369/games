<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Slingshot Boxing Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #14151c;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .hpRow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .hpRow .label { font-size: 12px; font-weight: bold; width: 42px; flex: 0 0 auto; }
    .hpBarWrap { flex: 1; height: 14px; border-radius: 999px; background: rgba(0,0,0,0.5); overflow: hidden; border: 1px solid rgba(255,255,255,0.25); }
    .hpFill { height: 100%; border-radius: 999px; transition: width 0.15s linear; }
    #playerHpFill { background: linear-gradient(90deg, #4c8dff, #7ab8ff); }
    #enemyHpFill { background: linear-gradient(90deg, #ff5a4c, #ff8a7a); }

    #flashText {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      font-size: clamp(20px, 7vw, 30px);
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 35;
      opacity: 0;
      transition: opacity 0.12s, transform 0.12s;
    }
    #flashText.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 32px;
      background: rgba(10,10,16,0.94);
    }
    .overlay.show { display: flex; }
    .overlay h1 { margin: 0; font-size: 24px; letter-spacing: 0.04em; }
    .overlay p { margin: 0; font-size: 13px; line-height: 1.8; opacity: 0.85; max-width: 340px; text-align: left; }
    .bigBtn {
      padding: 14px 32px;
      border-radius: 999px;
      border: none;
      background: #4c8dff;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .bigBtn:active { background: #3a72db; }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #14151c;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hpRow">
      <div class="label">敵</div>
      <div class="hpBarWrap"><div id="enemyHpFill" class="hpFill" style="width:100%"></div></div>
    </div>
    <div class="hpRow">
      <div class="label">自分</div>
      <div class="hpBarWrap"><div id="playerHpFill" class="hpFill" style="width:100%"></div></div>
    </div>
  </div>
  <div id="flashText"></div>

  <div id="titleOverlay" class="overlay show">
    <h1>SLINGSHOT BOXING</h1>
    <p>
      画面にボタンはありません。すべてジェスチャーで戦います。<br /><br />
      <b>パンチ</b>: 画面の左右どちらかを押さえ、ゴムを引くように外側へ引いて
      溜め、離すと発動(左=ジャブ、右=ストレート。引く距離と長さで威力が変わる)<br />
      <b>回避</b>: どこでもいいので素早く左右にスワイプ
    </p>
    <button id="startBtn" class="bigBtn">はじめる</button>
  </div>

  <div id="resultOverlay" class="overlay">
    <h1 id="resultTitle">WIN</h1>
    <p id="resultSubtitle"></p>
    <button id="retryBtn" class="bigBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="module" src="main.js"></script>
</body>
</html>
