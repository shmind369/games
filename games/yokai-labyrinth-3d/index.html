<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>旅の冒険者 ― 妖怪迷宮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    :root {
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
      --ink: #f3ead8; --sub: #b9ad97; --panel: rgba(22, 18, 28, .82); --line: rgba(243, 234, 216, .22);
      --red: #c0362c; --gold: #e0b84a;
    }
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #14111a; color: var(--ink);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .gothic { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }

    /* ---- HUD ---- */
    #hud { position: fixed; left: 8px; right: 8px; top: calc(var(--safe-t) + 8px); z-index: 5; display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
    #status { display: flex; gap: 8px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
    #face { width: 48px; height: 48px; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); flex: none; }
    #stats { font-size: 12px; line-height: 1.35; min-width: 0; }
    #stats .row1 { font-size: 14px; font-weight: 700; white-space: nowrap; }
    #stats .row1 .fl { color: var(--gold); margin-right: 6px; }
    .bar { position: relative; width: 130px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; margin: 2px 0 1px; }
    .bar > i { position: absolute; inset: 0 auto 0 0; background: #6ed36a; border-radius: 4px; transition: width .2s; }
    .bar.low > i { background: #e0473a; }
    #stats .sub { color: var(--sub); white-space: nowrap; }
    #map { margin-left: auto; width: 120px; border-radius: 8px; border: 1px solid var(--line); background: rgba(10,8,14,.55); pointer-events: auto; flex: none; image-rendering: pixelated; }
    #map.big { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(94vw, 560px); z-index: 30; }

    /* ---- log ---- */
    #log { position: fixed; left: 8px; right: 8px; bottom: calc(var(--safe-b) + 196px); z-index: 5; pointer-events: none; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
    #log div { font-size: 13px; padding: 3px 9px; border-radius: 6px; background: rgba(14,11,18,.72); transition: opacity .6s; max-width: 100%; }
    #log div.old { opacity: .55; }
    #log .dmg { color: #ff9b8a; } #log .good { color: #a6e39a; } #log .item { color: #f3d47a; } #log .sys { color: #9ec8ff; }

    /* ---- controls ---- */
    #controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px 10px calc(var(--safe-b) + 10px); display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
    #pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; pointer-events: auto; }
    #pad button, #acts button { border: 1px solid var(--line); background: rgba(30, 24, 38, .78); color: var(--ink); border-radius: 12px; font-size: 20px; padding: 0; touch-action: none; font-family: inherit; }
    #pad button:active, #pad button.on, #acts button:active { background: rgba(192, 54, 44, .75); }
    #pad button.mid { font-size: 11px; border-radius: 50%; }
    #acts { display: grid; grid-template-columns: repeat(2, 70px); gap: 6px; pointer-events: auto; }
    #acts button { height: 52px; font-size: 14px; font-weight: 700; }
    #acts button small { display: block; font-size: 10px; font-weight: 400; color: var(--sub); }
    #acts button.hot { background: rgba(224, 184, 74, .35); border-color: var(--gold); }

    /* ---- overlays ---- */
    .ov { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(8, 6, 12, .55); }
    .ov.show { display: flex; }
    .card { width: min(92vw, 420px); max-height: 82dvh; overflow: auto; background: #1e1826; border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
    .card h2 { margin: 0 0 10px; font-size: 18px; display: flex; justify-content: space-between; align-items: baseline; }
    .card h2 small { font-size: 12px; color: var(--sub); font-weight: 400; }
    .brush { display: inline-block; background: #e9dcc0; color: #1b1620; padding: 4px 18px; font-size: 26px; font-weight: 900; letter-spacing: .08em; clip-path: polygon(2% 10%, 98% 0, 100% 85%, 4% 100%, 0 50%); }

    #title { background: linear-gradient(180deg, rgba(10,8,14,.15) 0%, rgba(10,8,14,.0) 40%, rgba(10,8,14,.85) 75%); align-items: flex-end; }
    #title .inner { width: min(94vw, 460px); padding: 0 0 calc(var(--safe-b) + 28px); text-align: center; }
    #title .head { position: fixed; top: calc(var(--safe-t) + 26px); left: 0; right: 0; text-align: center; }
    #title .lead { font-size: 13px; color: var(--sub); line-height: 1.7; margin-top: 10px; }
    #title .label { font-size: 13px; color: var(--sub); margin: 0 0 8px; }
    #swatches { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; }
    #swatches button { width: 54px; padding: 6px 0 4px; border-radius: 10px; border: 2px solid transparent; background: rgba(255,255,255,.06); color: var(--ink); font-family: inherit; font-size: 12px; }
    #swatches button i { display: block; width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 4px; border: 1px solid rgba(255,255,255,.3); }
    #swatches button.sel { border-color: var(--gold); background: rgba(224,184,74,.15); }
    .big-btn { font-family: inherit; font-size: 19px; font-weight: 800; letter-spacing: .2em; padding: 12px 40px; border-radius: 12px; border: 1px solid #e8a090; background: var(--red); color: #fff; box-shadow: 0 4px 0 #7a1e18; }
    .big-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #7a1e18; }
    #best { font-size: 12px; color: var(--sub); margin-top: 12px; }
    #keys { font-size: 11px; color: var(--sub); margin-top: 6px; line-height: 1.6; }

    #invList { list-style: none; padding: 0; margin: 0; }
    #invList li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 15px; border: 1px solid transparent; }
    #invList li.sel { background: rgba(224,184,74,.14); border-color: rgba(224,184,74,.5); }
    #invList li .ic { width: 22px; text-align: center; }
    #invList li .eq { font-size: 11px; color: #1b1620; background: var(--gold); border-radius: 4px; padding: 0 4px; }
    #invList li.empty { color: var(--sub); }
    #invDesc { font-size: 12px; color: var(--sub); min-height: 2.6em; margin: 10px 2px 8px; line-height: 1.5; }
    #invActs { display: flex; gap: 6px; flex-wrap: wrap; }
    #invActs button, .card .btn { font-family: inherit; font-size: 15px; font-weight: 700; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: #2c2436; color: var(--ink); flex: 1; }
    #invActs button.pri { background: var(--red); border-color: #e8a090; }

    #result .card { text-align: center; }
    #result .card p { color: var(--sub); line-height: 1.8; }

    #fade { position: fixed; inset: 0; z-index: 25; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
    #fade.on { opacity: 1; }
    #fade .f1 { font-size: 34px; font-weight: 900; letter-spacing: .1em; }
    #fade .f2 { font-size: 15px; color: var(--sub); letter-spacing: .3em; }

    .pop { position: fixed; z-index: 8; pointer-events: none; font: 800 18px system-ui, sans-serif; color: #fff; text-shadow: 0 2px 0 #000, 0 0 4px #000; transform: translate(-50%, -50%); white-space: nowrap; }
    .pop.hurt { color: #ff7a6a; } .pop.heal { color: #8ef08a; } .pop.miss { color: #c8c8c8; font-size: 14px; } .pop.lv { color: #ffd65a; }

    @media (min-aspect-ratio: 1/1) {
      #log { bottom: calc(var(--safe-b) + 16px); left: 210px; right: 190px; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" class="gothic" style="display:none">
    <div id="status">
      <canvas id="face" width="16" height="16"></canvas>
      <div id="stats">
        <div class="row1"><span class="fl" id="sFloor">1F</span><span id="sLv">Lv 1</span></div>
        <div class="sub" id="sHp">HP 30/30</div>
        <div class="bar" id="hpBar"><i></i></div>
        <div class="sub" id="sSub">満腹 100% ・ 0銭</div>
      </div>
    </div>
    <canvas id="map"></canvas>
  </div>

  <div id="log" class="gothic"></div>

  <div id="controls" class="gothic" style="display:none">
    <div id="pad">
      <button data-d="7">↖</button><button data-d="0">↑</button><button data-d="1">↗</button>
      <button data-d="6">←</button><button class="mid" id="bWait">足踏み</button><button data-d="2">→</button>
      <button data-d="5">↙</button><button data-d="4">↓</button><button data-d="3">↘</button>
    </div>
    <div id="acts">
      <button id="bInv">道具<small>I</small></button>
      <button id="bThrow">投げる<small>T</small></button>
      <button id="bFeet">足元<small>Enter</small></button>
      <button id="bView">視点<small>V</small></button>
    </div>
  </div>

  <div id="title" class="ov show">
    <div class="head">
      <div class="brush">妖怪迷宮</div>
      <div class="lead">各地を旅する、名もなき冒険者。<br>財宝や珍しい道具を求めて、今日も迷宮に挑む。<br>目指すは地下十階に眠る「龍の宝玉」。</div>
    </div>
    <div class="inner">
      <div class="label">羽織の色</div>
      <div id="swatches"></div>
      <button class="big-btn" id="bStart">旅立つ</button>
      <div id="best" class="gothic"></div>
      <div id="keys" class="gothic">PC: 矢印/WASD 移動・QEZC 斜め・Shift+方向 向きだけ変える<br>Space 足踏み ・ I 道具 ・ T 投げる ・ Enter 足元/階段 ・ M 地図</div>
    </div>
  </div>

  <div id="inv" class="ov">
    <div class="card">
      <h2>旅袋 <small id="invCount">0/12</small></h2>
      <ul id="invList"></ul>
      <div id="invDesc"></div>
      <div id="invActs"></div>
    </div>
  </div>

  <div id="result" class="ov">
    <div class="card">
      <h2 id="resTitle" style="justify-content:center"></h2>
      <p id="resBody"></p>
      <button class="big-btn" id="bAgain">もう一度</button>
    </div>
  </div>

  <div id="fade"><div class="f1" id="fadeT1"></div><div class="f2" id="fadeT2"></div></div>

  <script type="module" src="main.js"></script>
</body>
</html>
