<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <title>旅の冒険者 ― 妖怪迷宮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#14111a" />
  <style>
    /*
      開発方針: iPhone の縦画面(基準 390×844)を正として設計する。
      PC では同じ縦長の画面を中央に表示するだけで、横長レイアウトは作らない。
    */
    :root {
      --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
      --ink: #f3ead8; --sub: #b9ad97; --dim: #7d7466; --panel: rgba(22, 18, 28, .84); --line: rgba(243, 234, 216, .2);
      --bg: #17131d; --card: #221b2a; --red: #c0362c; --gold: #e0b84a; --green: #8ee08a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #08070b; color: var(--ink);
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    button { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
    .mincho { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; }

    /* ---- 縦画面の枠(スマホでは全画面、PCでは中央に縦長で表示) ---- */
    #app { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, calc(100dvh * 0.4621)); overflow: hidden; background: var(--bg); }
    @media (pointer: coarse) { #app { width: 100vw; } }
    canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .screen { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; background: var(--bg); }
    .screen.show { display: flex; }
    .bar-top { display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-t) + 12px) 14px 10px; border-bottom: 1px solid var(--line); }
    .bar-top h1 { flex: 1; margin: 0; font-size: 20px; letter-spacing: .1em; }
    .bar-top .back { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 18px; }
    .bar-top .meta { font-size: 13px; color: var(--sub); }
    .scroll { flex: 1; overflow-y: auto; padding: 12px 14px; touch-action: pan-y; }
    .foot { padding: 10px 14px calc(var(--safe-b) + 14px); border-top: 1px solid var(--line); display: flex; gap: 8px; }
    .btn { flex: 1; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 16px; font-weight: 700; }
    .btn.pri { background: var(--red); border-color: #e8a090; color: #fff; }
    .btn:disabled { opacity: .35; }
    .brush { display: inline-block; background: #e9dcc0; color: #1b1620; padding: 6px 22px; font-size: 34px; font-weight: 900; letter-spacing: .1em; clip-path: polygon(2% 10%, 98% 0, 100% 85%, 4% 100%, 0 50%); }

    /* ---- タイトル ---- */
    #s-title { background: transparent; pointer-events: none; }
    #s-title > * { pointer-events: auto; }
    #s-title .head { padding-top: calc(var(--safe-t) + 44px); text-align: center; }
    #s-title .sub { font-size: 13px; color: var(--sub); letter-spacing: .3em; margin-top: 10px; }
    #s-title .spacer { flex: 1; pointer-events: none; }
    #s-title .bottom { padding: 18px 22px calc(var(--safe-b) + 22px); background: linear-gradient(180deg, rgba(23,19,29,0), rgba(23,19,29,.92) 22%); }
    #s-title .label { font-size: 12px; color: var(--sub); text-align: center; margin-bottom: 8px; letter-spacing: .2em; }
    #swatches { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
    #swatches button { width: 56px; padding: 6px 0 4px; border-radius: 10px; border: 2px solid transparent; background: rgba(255,255,255,.06); font-size: 12px; }
    #swatches button i { display: block; width: 26px; height: 26px; margin: 0 auto 4px; border-radius: 5px; border: 1px solid rgba(255,255,255,.3); }
    #swatches button.sel { border-color: var(--gold); background: rgba(224,184,74,.15); }
    #s-title .menu { display: flex; flex-direction: column; gap: 10px; }
    #s-title .menu .btn { min-height: 56px; font-size: 18px; letter-spacing: .3em; }
    #best { text-align: center; font-size: 12px; color: var(--sub); margin-top: 12px; min-height: 1em; }

    /* ---- セーブスロット ---- */
    .slot { width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; padding: 14px; margin-bottom: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); min-height: 96px; }
    .slot .no { width: 46px; height: 46px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; background: #e9dcc0; color: #1b1620; }
    .slot .body { flex: 1; min-width: 0; }
    .slot .t1 { font-size: 17px; font-weight: 700; }
    .slot .t1 .chip { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(255,255,255,.35); }
    .slot .t2 { font-size: 13px; color: var(--sub); margin-top: 4px; }
    .slot .t3 { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .slot.empty .t1 { color: var(--dim); }
    .slot:disabled { opacity: .4; }
    .slot.warn { border-color: var(--red); background: #3a1c20; }
    .note { font-size: 12px; color: var(--sub); line-height: 1.7; padding: 2px 4px; }

    /* ---- ダンジョン画面 ---- */
    #dungeon { position: absolute; inset: 0; z-index: 5; display: none; pointer-events: none; }
    #dungeon.show { display: block; }
    #hud { position: absolute; left: 8px; right: 8px; top: calc(var(--safe-t) + 8px); display: flex; gap: 8px; align-items: flex-start; }
    #status { flex: 1; display: flex; gap: 8px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
    #face { width: 52px; height: 52px; image-rendering: pixelated; border-radius: 8px; border: 1px solid var(--line); flex: none; }
    #stats { font-size: 12px; line-height: 1.35; min-width: 0; flex: 1; }
    #stats .row1 { font-size: 15px; font-weight: 800; white-space: nowrap; }
    #stats .row1 .fl { color: var(--gold); margin-right: 6px; }
    .gauge { position: relative; height: 7px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; margin: 3px 0 2px; }
    .gauge > i { position: absolute; inset: 0 auto 0 0; background: #6ed36a; border-radius: 4px; transition: width .2s; }
    .gauge.low > i { background: #e0473a; }
    #stats .sub { color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #map { width: 112px; height: 84px; border-radius: 10px; border: 1px solid var(--line); background: rgba(10,8,14,.6); pointer-events: auto; flex: none; image-rendering: pixelated; }
    #map.big { position: absolute; left: 8px; right: 8px; top: calc(var(--safe-t) + 80px); width: auto; height: auto; aspect-ratio: 4 / 3; z-index: 10; background: rgba(10,8,14,.88); }
    #log { position: absolute; left: 8px; right: 8px; bottom: calc(var(--safe-b) + 204px); display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
    #log div { font-size: 13px; padding: 3px 9px; border-radius: 6px; background: rgba(14,11,18,.74); max-width: 100%; }
    #log div.old { opacity: .55; }
    #log .dmg { color: #ff9b8a; } #log .good { color: #a6e39a; } #log .item { color: #f3d47a; } #log .sys { color: #9ec8ff; }
    #controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(var(--safe-b) + 12px); display: flex; justify-content: space-between; align-items: flex-end; }
    #pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; pointer-events: auto; }
    #pad button, #acts button { border: 1px solid var(--line); background: rgba(30, 24, 38, .8); border-radius: 12px; font-size: 20px; padding: 0; touch-action: none; }
    #pad button:active, #pad button.on, #acts button:active { background: rgba(192, 54, 44, .75); }
    #pad button.mid { font-size: 11px; border-radius: 50%; }
    #acts { display: grid; grid-template-columns: repeat(2, 66px); grid-auto-rows: 56px; gap: 6px; pointer-events: auto; }
    #acts button { font-size: 14px; font-weight: 700; }
    #acts button small { display: block; font-size: 10px; font-weight: 400; color: var(--sub); }
    #acts button.hot { background: rgba(224, 184, 74, .35); border-color: var(--gold); }
    #acts button.off { opacity: .45; }

    /* ---- アイテム画面 ---- */
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border-radius: 10px; font-size: 16px; border: 1px solid transparent; }
    .list li + li { margin-top: 2px; }
    .list li.sel { background: rgba(224,184,74,.14); border-color: rgba(224,184,74,.5); }
    .list li .ic { width: 26px; text-align: center; font-size: 18px; }
    .list li .nm { flex: 1; min-width: 0; }
    .list li .tag { font-size: 11px; color: #1b1620; background: var(--gold); border-radius: 4px; padding: 1px 5px; }
    .list li .val { font-size: 13px; color: var(--sub); }
    .list li .up { color: var(--green); } .list li .down { color: #ff8a7a; }
    .list li.empty { color: var(--dim); justify-content: center; }
    .detail { padding: 12px 14px 0; border-top: 1px solid var(--line); min-height: 76px; }
    .detail .dn { font-size: 16px; font-weight: 800; }
    .detail .dd { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.6; }

    /* ---- 装備画面 ---- */
    .eqslots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .eqslot { border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 12px; }
    .eqslot .k { font-size: 12px; color: var(--sub); letter-spacing: .2em; }
    .eqslot .v { font-size: 16px; font-weight: 800; margin-top: 6px; min-height: 1.3em; }
    .eqslot .n { font-size: 13px; color: var(--gold); margin-top: 2px; }
    .eqstats { display: flex; justify-content: space-around; border-radius: 14px; border: 1px solid var(--line); padding: 10px; margin-bottom: 14px; background: rgba(255,255,255,.03); }
    .eqstats div { text-align: center; font-size: 12px; color: var(--sub); }
    .eqstats b { display: block; font-size: 22px; color: var(--ink); }
    .sect { font-size: 12px; color: var(--sub); letter-spacing: .2em; margin: 14px 4px 6px; }

    /* ---- ゲームオーバー/踏破 ---- */
    #s-over { align-items: center; justify-content: center; text-align: center; padding: calc(var(--safe-t) + 20px) 22px calc(var(--safe-b) + 22px); background: radial-gradient(ellipse at 50% 35%, #2a1a22 0%, #0c0a10 70%); }
    #s-over.clear { background: radial-gradient(ellipse at 50% 35%, #3a3018 0%, #0c0a10 70%); }
    #overFace { width: 128px; height: 128px; image-rendering: pixelated; border-radius: 16px; border: 2px solid var(--line); margin: 22px auto 14px; display: block; }
    #overReason { font-size: 15px; line-height: 1.8; color: var(--ink); }
    .rec { width: 100%; margin: 18px 0 22px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); }
    .rec div { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 15px; }
    .rec div + div { border-top: 1px solid var(--line); }
    .rec span { color: var(--sub); }
    #s-over .btns { width: 100%; display: flex; flex-direction: column; gap: 10px; }

    /* ---- 確認ダイアログ ---- */
    #confirm { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 24px; }
    #confirm.show { display: flex; }
    #confirm .box { width: 100%; border-radius: 16px; background: var(--card); border: 1px solid var(--line); padding: 18px; }
    #confirm p { margin: 0 0 16px; font-size: 15px; line-height: 1.7; }
    #confirm .row { display: flex; gap: 8px; }

    #fade { position: absolute; inset: 0; z-index: 30; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
    #fade.on { opacity: 1; }
    #fade .f1 { font-size: 36px; font-weight: 900; letter-spacing: .1em; }
    #fade .f2 { font-size: 15px; color: var(--sub); letter-spacing: .3em; }

    .pop { position: absolute; z-index: 8; pointer-events: none; font: 800 18px system-ui, sans-serif; color: #fff; text-shadow: 0 2px 0 #000, 0 0 4px #000; transform: translate(-50%, -50%); white-space: nowrap; }
    .pop.hurt { color: #ff7a6a; } .pop.heal { color: #8ef08a; } .pop.miss { color: #c8c8c8; font-size: 14px; } .pop.lv { color: #ffd65a; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <!-- ダンジョン画面 -->
  <div id="dungeon">
    <div id="hud">
      <div id="status">
        <canvas id="face" width="16" height="16"></canvas>
        <div id="stats">
          <div class="row1"><span class="fl" id="sFloor">1F</span><span id="sLv">Lv 1</span></div>
          <div class="sub" id="sHp">HP 30/30</div>
          <div class="gauge" id="hpBar"><i></i></div>
          <div class="sub" id="sSub">満腹 100% ・ 0銭</div>
        </div>
      </div>
      <canvas id="map"></canvas>
    </div>
    <div id="log"></div>
    <div id="controls">
      <div id="pad">
        <button data-d="7">↖</button><button data-d="0">↑</button><button data-d="1">↗</button>
        <button data-d="6">←</button><button class="mid" id="bWait">足踏み</button><button data-d="2">→</button>
        <button data-d="5">↙</button><button data-d="4">↓</button><button data-d="3">↘</button>
      </div>
      <div id="acts">
        <button id="bInv">道具<small>I</small></button>
        <button id="bEquip">装備<small>R</small></button>
        <button id="bThrow">投げる<small>T</small></button>
        <button id="bFeet">足元<small>Enter</small></button>
        <button id="bView">視点<small>V</small></button>
        <button id="bQuit">中断<small>Esc</small></button>
      </div>
    </div>
  </div>

  <!-- タイトル画面 -->
  <div id="s-title" class="screen show">
    <div class="head mincho">
      <div class="brush">妖怪迷宮</div>
      <div class="sub">旅の冒険者</div>
    </div>
    <div class="spacer"></div>
    <div class="bottom">
      <div class="label">羽織の色</div>
      <div id="swatches"></div>
      <div class="menu">
        <button class="btn pri mincho" id="bNew">はじめから</button>
        <button class="btn mincho" id="bCont">つづきから</button>
      </div>
      <div id="best"></div>
    </div>
  </div>

  <!-- セーブスロット画面 -->
  <div id="s-slots" class="screen">
    <div class="bar-top"><button class="back" id="slotsBack">←</button><h1 class="mincho" id="slotsTitle">記録を選ぶ</h1></div>
    <div class="scroll" id="slotList"></div>
    <div class="foot" style="display:block"><div class="note" id="slotNote"></div></div>
  </div>

  <!-- アイテム画面 -->
  <div id="s-items" class="screen">
    <div class="bar-top"><button class="back" id="itemsBack">←</button><h1 class="mincho">道具</h1><span class="meta" id="invCount">0/12</span></div>
    <div class="scroll"><ul class="list" id="invList"></ul></div>
    <div class="detail"><div class="dn" id="invName"></div><div class="dd" id="invDesc"></div></div>
    <div class="foot" id="invActs"></div>
  </div>

  <!-- 装備画面 -->
  <div id="s-equip" class="screen">
    <div class="bar-top"><button class="back" id="equipBack">←</button><h1 class="mincho">装備</h1></div>
    <div class="scroll">
      <div class="eqslots">
        <div class="eqslot"><div class="k">武器</div><div class="v" id="eqW">―</div><div class="n" id="eqWn"></div></div>
        <div class="eqslot"><div class="k">笠</div><div class="v" id="eqH">―</div><div class="n" id="eqHn"></div></div>
      </div>
      <div class="eqstats">
        <div>攻撃<b id="eqAtk">0</b></div>
        <div>防御<b id="eqDef">0</b></div>
        <div>Lv<b id="eqLv">1</b></div>
      </div>
      <div class="sect">刀</div>
      <ul class="list" id="eqListW"></ul>
      <div class="sect">笠</div>
      <ul class="list" id="eqListH"></ul>
    </div>
    <div class="foot"><div class="note" style="flex:1">付け替えると、戻るときに1ターン経過します。</div></div>
  </div>

  <!-- ゲームオーバー / 踏破画面 -->
  <div id="s-over" class="screen">
    <div class="mincho"><span class="brush" id="overTitle">旅の終わり</span></div>
    <canvas id="overFace" width="16" height="16"></canvas>
    <div id="overReason" class="mincho"></div>
    <div class="rec" id="overRec"></div>
    <div class="btns">
      <button class="btn pri mincho" id="bOverNew">新しい旅へ</button>
      <button class="btn mincho" id="bOverTitle">タイトルへ</button>
    </div>
  </div>

  <div id="confirm"><div class="box"><p id="confirmMsg"></p><div class="row"><button class="btn" id="confirmNo">やめる</button><button class="btn pri" id="confirmYes">はい</button></div></div></div>
  <div id="fade"><div class="f1 mincho" id="fadeT1"></div><div class="f2 mincho" id="fadeT2"></div></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
