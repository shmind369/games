<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Photo Spin 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #101216;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #topBar {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn {
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.14);
      color: #eee;
      touch-action: manipulation;
    }
    .btn:active { background: rgba(255,255,255,0.28); }
    .btn.primary { background: #4c8dff; color: #fff; }
    .btn.primary:active { background: #3a72db; }
    #fileInput { display: none; }

    #placeholder {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 0 32px;
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 14px;
      pointer-events: none;
      z-index: 5;
    }
    #placeholder.hide { display: none; }

    #status {
      position: fixed;
      bottom: max(64px, calc(env(safe-area-inset-bottom) + 56px));
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      opacity: 0.8;
      pointer-events: none;
      z-index: 30;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    #hint {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      opacity: 0.55;
      pointer-events: none;
      z-index: 30;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #101216;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="placeholder">
    <div style="font-size:40px;">🖼️</div>
    <div>画像を読み込むと、推定した奥行きをもとに<br />立体的に表示されます</div>
  </div>

  <div id="topBar">
    <button id="loadBtn" class="btn primary">画像を選ぶ</button>
    <button id="resetBtn" class="btn">リセット</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" />

  <div id="status"></div>
  <div id="hint">ドラッグで回転・ピンチで拡大縮小(疑似3D・簡易奥行き推定)</div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
