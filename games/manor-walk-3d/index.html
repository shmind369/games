<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Manor Walk 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #05040a;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    #hud .pill {
      background: rgba(0,0,0,0.5);
      padding: 8px 14px;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }

    #message {
      position: fixed;
      top: 28%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(0,0,0,0.65);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 80%;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    #message.show { opacity: 1; }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 20;
      display: flex;
      justify-content: center;
    }
    #dpad {
      display: grid;
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 60px 60px 60px;
      gap: 6px;
    }
    .dbtn {
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 24px;
      touch-action: manipulation;
    }
    .dbtn:active, .dbtn.pressed { background: rgba(255,255,255,0.32); }
    #btnTurnLeft { grid-column: 1; grid-row: 2; }
    #btnForward { grid-column: 2; grid-row: 1; }
    #btnTurnRight { grid-column: 3; grid-row: 2; }
    #btnBackward { grid-column: 2; grid-row: 3; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 32px;
      background: rgba(5,4,10,0.94);
    }
    .overlay.show { display: flex; }
    .overlay h1 { margin: 0; font-size: 22px; letter-spacing: 0.05em; }
    .overlay p { margin: 0; font-size: 13px; line-height: 1.7; opacity: 0.85; max-width: 340px; }
    .bigBtn {
      padding: 14px 32px;
      border-radius: 999px;
      border: none;
      background: #a1793f;
      color: #1b1206;
      font-size: 16px;
      font-weight: bold;
      touch-action: manipulation;
    }
    .bigBtn:active { background: #8a6530; }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #05040a;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill" id="roomLabel">玄関ホール</div>
  </div>
  <div id="message"></div>

  <div id="controls">
    <div id="dpad">
      <button id="btnTurnLeft" class="dbtn">◀</button>
      <button id="btnForward" class="dbtn">▲</button>
      <button id="btnTurnRight" class="dbtn">▶</button>
      <button id="btnBackward" class="dbtn">▼</button>
    </div>
  </div>

  <div id="titleOverlay" class="overlay show">
    <h1>MANOR WALK 3D</h1>
    <p>
      古い洋館を歩き回る、固定カメラの探索デモ。部屋ごとにカメラが切り替わる、
      昔ながらのサバイバルホラー風の演出です。<br /><br />
      ▲▼で前進・後退、◀▶でその場旋回(タンク操作)。<br />
      奥の書斎にある光る扉を目指そう。
    </p>
    <button id="startBtn" class="bigBtn">はじめる</button>
  </div>

  <div id="goalOverlay" class="overlay">
    <h1>GOAL</h1>
    <p>洋館の最奥、書斎の扉にたどり着いた。</p>
    <button id="retryBtn" class="bigBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
