<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>3Dバッティングセンター</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0a1622;
      font-family: system-ui, sans-serif;
      color: #f0f4f8;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }

    #swingLayer {
      position: fixed;
      inset: 0;
      z-index: 15;
      touch-action: none;
    }

    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-size: clamp(13px, 3.8vw, 18px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 20;
    }
    #hud span { font-weight: bold; }

    #speedTag {
      position: fixed;
      top: calc(max(10px, env(safe-area-inset-top)) + 34px);
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(14px, 4.2vw, 20px);
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.15s;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 20;
    }
    #speedTag.show { opacity: 0.85; }

    #resultBanner {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: clamp(28px, 10vw, 48px);
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      z-index: 25;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      transition: opacity 0.2s, transform 0.2s;
      text-align: center;
      white-space: nowrap;
    }
    #resultBanner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    #hint {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(12px, 3.4vw, 15px);
      opacity: 0.75;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 20;
      text-align: center;
    }

    #startOverlay, #overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: rgba(0, 0, 0, 0.72);
      text-align: center;
      padding: 0 24px;
      z-index: 50;
    }
    #startOverlay.show, #overlay.show { display: flex; }
    #startOverlay h1, #overlay h1 { margin: 0; font-size: clamp(26px, 8vw, 40px); }
    #startOverlay p, #overlay .stats { font-size: clamp(14px, 4.2vw, 18px); line-height: 1.7; margin: 0; }
    #startOverlay button, #overlay button {
      font-size: clamp(16px, 4.5vw, 18px);
      padding: 12px 32px;
      border-radius: 8px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #0a1622;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>球数: <span id="pitchCount">0</span>/<span id="pitchTotal">10</span></div>
    <div>本塁打: <span id="homerCount">0</span></div>
    <div>スコア: <span id="score">0</span></div>
  </div>
  <div id="speedTag"></div>
  <div id="resultBanner"></div>
  <div id="hint">球が来たタイミングで画面をタップ!</div>

  <div id="swingLayer"></div>

  <div id="startOverlay" class="show">
    <h1>3Dバッティングセンター</h1>
    <p>投げられた球のタイミングに合わせて画面をタップしてスイング。<br />
      ジャストミートでホームランを狙おう!(全10球)</p>
    <button id="startBtn">プレイ開始</button>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">結果</h1>
    <div class="stats" id="overlayStats"></div>
    <button id="restartBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
