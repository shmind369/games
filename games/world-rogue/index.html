<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>WORLD ROGUE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #10151a;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    canvas { display: block; touch-action: none; }

    /* Wonders-Dungeon-style screen split: play view on top, operation
       panel below, each taking half the screen height. */
    #gameArea {
      position: relative;
      flex: 1 1 50%;
      min-height: 0;
      overflow: hidden;
    }

    #hud {
      position: absolute;
      top: max(8px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: clamp(11px, 3.2vw, 13px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 20;
    }
    #statPanel {
      background: rgba(10, 14, 18, 0.7);
      border-radius: 8px;
      padding: 6px 10px;
      pointer-events: auto;
      min-width: 130px;
    }
    #statPanel .row { display: flex; justify-content: space-between; gap: 10px; }
    #statPanel .lv { color: #ffe066; font-weight: bold; }
    #hpBar, #xpBar {
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.15);
      overflow: hidden;
      margin: 2px 0 4px;
    }
    #hpFill { height: 100%; background: #ff6b6b; width: 100%; }
    #xpFill { height: 100%; background: #66c2ff; width: 0%; }

    #mapToggle {
      pointer-events: auto;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #eee;
      font-size: 16px;
      touch-action: manipulation;
    }

    #messageLog {
      position: absolute;
      top: max(70px, calc(env(safe-area-inset-top) + 60px));
      left: 10px;
      right: 10px;
      z-index: 20;
      pointer-events: none;
      font-size: clamp(11px, 3.2vw, 13px);
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #messageLog div { opacity: 0.92; }

    /* Operation panel: solid lower half, distinct from the play view above. */
    #controls {
      position: relative;
      flex: 1 1 50%;
      min-height: 0;
      z-index: 20;
      display: flex;
      flex-direction: row;
      justify-content: space-evenly;
      align-items: center;
      padding: 10px 14px max(12px, env(safe-area-inset-bottom));
      background: #161c26;
      border-top: 2px solid rgba(255,255,255,0.12);
    }
    /* 8-direction pad (including diagonals), Mystery-Dungeon-genre style. */
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 4px;
      flex: 0 0 auto;
    }
    .dbtn {
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.14);
      color: #eee;
      font-size: 17px;
      touch-action: manipulation;
    }
    .dbtn:active { background: rgba(255,255,255,0.32); }
    #dCenter { background: transparent; pointer-events: none; }

    #actionButtons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 0 0 auto;
    }
    .actBtn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: clamp(13px, 3.8vw, 15px);
      background: rgba(255,255,255,0.14);
      color: #eee;
      touch-action: manipulation;
    }
    .actBtn:active { background: rgba(255,255,255,0.32); }

    #worldMapOverlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.82);
    }
    #worldMapOverlay.show { display: flex; }
    #worldMapPanel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #worldMapCanvas {
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.25);
    }
    #worldMapPanel button {
      font-size: clamp(13px, 4vw, 15px);
      padding: 8px 24px;
      border-radius: 8px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      text-align: center;
      padding: 0 24px;
    }
    #overlay.show { display: flex; }
    #overlay h1 { margin: 0; font-size: clamp(26px, 8vw, 38px); }
    #overlay p { margin: 0; opacity: 0.85; }
    #overlay button {
      font-size: clamp(15px, 4.3vw, 17px);
      padding: 10px 28px;
      border-radius: 8px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #10151a;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <div id="gameArea">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="statPanel">
        <div class="row"><span class="lv">Lv <span id="lv">1</span></span><span id="hpText">HP 20/20</span></div>
        <div id="hpBar"><div id="hpFill"></div></div>
        <div class="row"><span id="xpText">XP 0/10</span></div>
        <div id="xpBar"><div id="xpFill"></div></div>
      </div>
      <button id="mapToggle">🗺</button>
    </div>

    <div id="messageLog"></div>
  </div>

  <div id="controls">
    <div id="dpad">
      <button id="dUpLeft" class="dbtn">↖</button>
      <button id="dUp" class="dbtn">▲</button>
      <button id="dUpRight" class="dbtn">↗</button>
      <button id="dLeft" class="dbtn">◀</button>
      <div id="dCenter"></div>
      <button id="dRight" class="dbtn">▶</button>
      <button id="dDownLeft" class="dbtn">↙</button>
      <button id="dDown" class="dbtn">▼</button>
      <button id="dDownRight" class="dbtn">↘</button>
    </div>
    <div id="actionButtons">
      <button id="waitBtn" class="actBtn">待機</button>
      <button id="defendBtn" class="actBtn">防御</button>
    </div>
  </div>

  <div id="worldMapOverlay">
    <div id="worldMapPanel">
      <canvas id="worldMapCanvas" width="300" height="300"></canvas>
      <button id="closeMapBtn">閉じる</button>
    </div>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">GAME OVER</h1>
    <p id="overlaySubtitle"></p>
    <button id="restartBtn">はじめから</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="module" src="main.js"></script>
</body>
</html>
