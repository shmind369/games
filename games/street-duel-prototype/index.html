<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>路上デュエル・プロトタイプ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #2a2a38;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(13px, 3.8vw, 18px);
      font-weight: bold;
      text-shadow: 0 1px 3px rgba(0,0,0,0.85);
      pointer-events: none;
      z-index: 20;
    }
    #hits { color: #9fd6ff; }
    #timer { color: #ffe066; }

    #flashText {
      position: fixed;
      top: 32%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      font-size: clamp(22px, 8vw, 32px);
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 35;
      opacity: 0;
      transition: opacity 0.12s, transform 0.12s;
    }
    #flashText.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 14px max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(42,42,56,0) 0%, rgba(42,42,56,0.92) 22%, rgba(42,42,56,0.92) 100%);
    }
    .ctrlBtn {
      border: none;
      border-radius: 12px;
      font-size: clamp(16px, 5vw, 20px);
      font-weight: bold;
      padding: 18px 0;
      color: #fff;
      touch-action: none;
      transition: background 0.08s, transform 0.08s;
    }
    #highBtn { background: #3a6bd8; }
    #lowBtn { background: #d2794a; }
    .ctrlBtn.active { transform: scale(0.96); filter: brightness(1.25); }
    .ctrlBtn .sub { display: block; font-size: 0.6em; font-weight: normal; opacity: 0.8; margin-top: 2px; }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      text-align: center;
      padding: 0 24px;
    }
    #overlay.show { display: flex; }
    #overlay h1 { margin: 0; font-size: clamp(26px, 8vw, 38px); }
    #overlay p { margin: 0; opacity: 0.85; }
    #overlay button {
      font-size: clamp(15px, 4.3vw, 17px);
      padding: 10px 28px;
      border-radius: 8px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #2a2a38;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div>ヒット <span id="hits">0</span></div>
    <div id="timer">60</div>
  </div>

  <div id="controls">
    <button id="highBtn" class="ctrlBtn">上段<span class="sub">タップ:パンチ / ホールド:ガード</span></button>
    <button id="lowBtn" class="ctrlBtn">下段<span class="sub">タップ:パンチ / ホールド:ガード</span></button>
  </div>

  <div id="flashText"></div>

  <div id="overlay">
    <h1 id="overlayTitle">WIN</h1>
    <p id="overlaySubtitle"></p>
    <button id="restartBtn">もう一度</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="module" src="main.js"></script>
</body>
</html>
