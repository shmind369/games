<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>SHIP IT SIM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0d1117;
      font-family: system-ui, sans-serif;
      color: #eee;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; touch-action: none; }

    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 20;
    }
    #stageTitle {
      background: rgba(10, 14, 18, 0.72);
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: bold;
    }
    #stageProgress {
      background: rgba(10, 14, 18, 0.72);
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      gap: 5px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25); }
    .dot.done { background: #4ade80; }
    .dot.current { background: #ffe066; }

    #banner {
      position: fixed;
      top: max(52px, calc(env(safe-area-inset-top) + 44px));
      left: 12px;
      right: 12px;
      z-index: 20;
      pointer-events: none;
      text-align: center;
      font-size: 13px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      opacity: 0.9;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: rgba(6, 8, 12, 0.88);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .overlay.show { display: flex; }
    .overlay h1 { margin: 0; font-size: clamp(24px, 7vw, 34px); }
    .overlay h2 { margin: 0; font-size: clamp(18px, 5.5vw, 24px); }
    .overlay p { margin: 0; opacity: 0.85; max-width: 320px; line-height: 1.5; font-size: 14px; }
    .overlay .stars { font-size: 32px; letter-spacing: 4px; }
    .overlay .stats { font-size: 15px; opacity: 0.9; display: flex; flex-direction: column; gap: 4px; }
    .overlay button {
      font-size: clamp(15px, 4.3vw, 17px);
      padding: 12px 32px;
      border-radius: 10px;
      border: none;
      background: #4c8dff;
      color: white;
      touch-action: manipulation;
      margin-top: 6px;
    }
    .overlay button:active { background: #3a72db; }
    .overlay button.secondary {
      background: rgba(255,255,255,0.14);
    }

    #rotateOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #0d1117;
      color: #eee;
      font-size: clamp(16px, 5vw, 20px);
    }
    @media (orientation: landscape) {
      #rotateOverlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="stageTitle">SHIP IT SIM</div>
    <div id="stageProgress"></div>
  </div>
  <div id="banner"></div>

  <div id="titleOverlay" class="overlay show">
    <h1>SHIP IT SIM</h1>
    <p>HTML → CSS → JS → PHP と作り込んだWebサービスを、iOSアプリとしてリリースするまでの開発工程を6つのミニゲームで駆け抜けよう。</p>
    <button id="startBtn">はじめる</button>
  </div>

  <div id="stageClearOverlay" class="overlay">
    <h2 id="clearStageTitle">CLEAR!</h2>
    <div id="clearStars" class="stars">★★★</div>
    <p id="clearComment"></p>
    <button id="nextStageBtn">次の工程へ</button>
  </div>

  <div id="resultsOverlay" class="overlay">
    <h1>🎉 リリース完了！</h1>
    <div id="resultStats" class="stats"></div>
    <button id="restartBtn">もう一度最初から</button>
  </div>

  <div id="rotateOverlay">縦向きにしてプレイしてください</div>

  <script type="module" src="main.js"></script>
</body>
</html>
